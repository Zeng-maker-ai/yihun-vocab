name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APKs (debug + release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/LEXI-2.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/LEXI-2.0-release.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LEXI-apk
          path: out/

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: LEXI v2.0 Android
          body: |
            自动构建的安卓安装包（每次 push main 自动更新本 Release）。
            - LEXI-2.0-release.apk：正式签名版，推荐安装
            - LEXI-2.0-debug.apk：调试版
            两个版本签名相同，可直接覆盖安装。
          files: |
            out/LEXI-2.0-debug.apk
            out/LEXI-2.0-release.apk
