<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>LEXI｜易混词辨析</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
/* LEXI 易混词辨析 v2 —— 手机竖屏优先 */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --border: #e1e7ec;
  --ink: #17242f;
  --muted: #5e6f7f;
  --faint: #8fa0ae;
  --primary: #0f766e;
  --primary-deep: #0b5952;
  --primary-weak: #e4f3f1;
  --accent: #b45309;
  --accent-weak: #fdf0e0;
  --danger: #be123c;
  --danger-weak: #fdeef1;
  --ok: #15803d;
  --ok-weak: #e9f7ee;
  --mark-a: #fbbf24;
  --radius: 12px;
  --radius-s: 8px;
  --shadow: 0 1px 3px rgba(23, 36, 47, .07), 0 4px 14px rgba(23, 36, 47, .05);
  --nav-h: 58px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

/* ── 顶栏 ── */
.appbar { background: linear-gradient(135deg, #0b5952, #0f766e); color: #fff; padding: 14px 0 16px; }
.appbar .wrap { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand-name { font-size: 21px; font-weight: 800; letter-spacing: .5px; }
.brand-sub { font-size: 12px; opacity: .85; }
.appbar-stats { font-size: 12px; opacity: .9; text-align: right; }
.appbar-stats b { font-size: 14px; }

/* ── 底部导航 ── */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bottomnav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--faint); font-size: 11px; font-weight: 600;
}
.bottomnav button svg { width: 22px; height: 22px; }
.bottomnav button.active { color: var(--primary); }
main { padding-bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0)); }

/* ── 页面 ── */
.page { display: none; padding-top: 14px; }
.page.active { display: block; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.page-head h2 { font-size: 18px; }

/* ── 卡片 ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }

/* ── 首页对比入口 ── */
.hero { margin-top: 12px; }
.hero-box { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border: 1px solid var(--border); }
.hero-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.hero-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
.compare-inputs { display: flex; align-items: center; gap: 8px; }
.compare-inputs input {
  flex: 1; min-width: 0; border: 1.5px solid var(--border); border-radius: var(--radius-s);
  padding: 10px 12px; font-size: 16px; background: var(--bg);
}
.compare-inputs input:focus { outline: none; border-color: var(--primary); background: #fff; }
.swap-btn { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; background: var(--primary-weak); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--primary); color: #fff; border-radius: var(--radius-s);
  padding: 10px 16px; font-weight: 700; font-size: 14.5px;
  transition: transform .06s;
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--primary-weak); color: var(--primary); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn.danger { background: var(--danger-weak); color: var(--danger); }

/* ── 搜索 ── */
.search-box { position: relative; margin-top: 14px; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-s); padding: 0 12px; }
.search-wrap:focus-within { border-color: var(--primary); }
.search-wrap input { flex: 1; border: 0; outline: none; background: none; padding: 11px 0; font-size: 15.5px; }
.search-wrap svg { flex: 0 0 auto; color: var(--faint); }
.suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s); box-shadow: var(--shadow); list-style: none; margin: 0; padding: 4px 0; z-index: 30; max-height: 300px; overflow: auto; }
.suggestions li { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; }
.suggestions li:active { background: var(--primary-weak); }
.sug-word { font-weight: 700; }
.sug-ipa { color: var(--faint); font-size: 12.5px; }
.sug-mean { color: var(--muted); font-size: 12.5px; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hotwords { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.hotwords button { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px; font-size: 13px; color: var(--muted); }
.result-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin: 14px 0 8px; }

/* ── 筛选 chips ── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600; }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ── 词条卡片 ── */
.group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.group-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
.group-words { flex: 1; font-size: 15.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.b-level { background: var(--primary-weak); color: var(--primary); }
.b-type { background: var(--accent-weak); color: var(--accent); }
.fav-btn { flex: 0 0 auto; font-size: 18px; color: var(--faint); padding: 2px 4px; }
.fav-btn.on { color: #e11d48; }
.group-body { padding: 10px 14px 14px; }
.word-cols { display: flex; gap: 8px; }
.word-col { flex: 1; min-width: 0; background: var(--bg); border-radius: var(--radius-s); padding: 10px; position: relative; }
.word-en { font-size: 17.5px; font-weight: 800; letter-spacing: .2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.word-ipa { display: block; color: var(--faint); font-size: 12.5px; margin-top: 2px; font-family: "Segoe UI", sans-serif; }
.word-pos { display: inline-block; font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-top: 6px; margin-right: 4px; }
.word-mean { display: block; color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.play-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-weak); color: var(--primary); display: flex; align-items: center; justify-content: center; }
.play-btn svg { width: 15px; height: 15px; }
.play-btn:active { transform: scale(.92); }
.diff-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.note { background: var(--primary-weak); border-radius: var(--radius-s); padding: 9px 11px; font-size: 13.5px; margin-top: 10px; color: var(--primary-deep); }
.note b { font-weight: 800; }
.examples { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
.example-row { font-size: 13.5px; color: var(--ink); margin-bottom: 6px; }
.example-row .ex-word { font-weight: 800; color: var(--primary-deep); }
.example-row .ex-col { color: var(--faint); font-size: 12px; margin-left: 6px; }
.src-badge { font-size: 10.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 8px; }
.more-btn { width: 100%; text-align: center; color: var(--primary); font-weight: 600; font-size: 13px; padding: 9px 0 0; }
.diff-mark { background: var(--mark-a); border-radius: 3px; padding: 0 2px; font-weight: 800; }
.browse-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; color: var(--muted); font-size: 13px; }
.browse-head .bh-title { font-size: 15px; font-weight: 800; color: var(--ink); }
.empty { background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); text-align: center; padding: 26px 16px; font-size: 13.5px; }

/* ── 对比页 ── */
.overlay-view { position: fixed; inset: 0; background: var(--bg); z-index: 60; display: none; overflow-y: auto; padding-bottom: 30px; }
.overlay-view.open { display: block; }
.overlay-bar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.overlay-bar .wrap { display: flex; align-items: center; gap: 10px; height: 50px; }
.back-btn { font-size: 22px; color: var(--primary); width: 30px; }
.overlay-bar h2 { font-size: 16.5px; flex: 1; }
.cp-word-box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px; margin-bottom: 10px; }
.cp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cp-word { font-size: 21px; font-weight: 800; }
.cp-ipa { color: var(--faint); font-size: 13px; }
.cp-mean { color: var(--muted); font-size: 13.5px; }
.cp-col { flex: 1; min-width: 0; }
.diff-row { display: flex; gap: 8px; margin-top: 6px; }
.diff-cell { flex: 1; background: var(--bg); border-radius: var(--radius-s); padding: 10px; text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 1px; word-break: break-all; }
.diff-cell .lbl { display: block; font-size: 11px; color: var(--faint); font-weight: 400; letter-spacing: 0; }
.sum-line { background: var(--primary-weak); color: var(--primary-deep); border-radius: var(--radius-s); padding: 9px 12px; font-size: 13.5px; margin-top: 10px; }
.audio-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.audio-note { font-size: 12px; color: var(--faint); }
.loading { color: var(--muted); font-size: 13px; padding: 8px 0; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.def-item { margin-bottom: 8px; font-size: 13.5px; }
.def-item .dp { color: var(--primary); font-weight: 700; margin-right: 6px; }
.def-item .dd { color: var(--ink); }
.def-item .de { color: var(--muted); font-size: 12.5px; display: block; margin-top: 2px; }

/* ── 训练 ── */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; text-align: left; box-shadow: var(--shadow); position: relative; }
.mode-card .mi { font-size: 22px; }
.mode-card .mt { font-weight: 800; font-size: 14.5px; margin-top: 6px; }
.mode-card .md { color: var(--muted); font-size: 12px; margin-top: 2px; }
.review-banner { background: linear-gradient(135deg, #0b5952, #0f766e); color: #fff; border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.review-banner .rt { font-weight: 700; font-size: 14.5px; }
.review-banner .rs { font-size: 12px; opacity: .85; margin-top: 2px; }
.review-banner .btn { background: rgba(255,255,255,.18); color: #fff; }
.quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.progress-track { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; flex: 1; margin-right: 10px; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .2s; }
.quiz-prompt { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 14px; text-align: center; margin-bottom: 12px; }
.quiz-prompt .qp-label { font-size: 12px; color: var(--faint); margin-bottom: 6px; }
.quiz-prompt .qp-main { font-size: 20px; font-weight: 800; }
.quiz-prompt .qp-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.quiz-prompt .qp-sentence { font-size: 16.5px; line-height: 1.7; }
.quiz-prompt .qp-blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--primary); color: var(--primary); font-weight: 800; text-align: center; }
.opt-list { display: grid; gap: 8px; }
.opt-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-s); padding: 13px 14px; font-size: 16px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 10px; }
.opt-btn:active { border-color: var(--primary); }
.opt-btn.correct { border-color: var(--ok); background: var(--ok-weak); }
.opt-btn.wrong { border-color: var(--danger); background: var(--danger-weak); }
.opt-btn .opt-key { flex: 0 0 22px; height: 22px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 12px; display: flex; align-items: center; justify-content: center; }
.feedback { border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; font-size: 13.5px; }
.feedback.good { background: var(--ok-weak); color: var(--ok); }
.feedback.bad { background: var(--danger-weak); color: var(--danger); }
.feedback .fb-title { font-weight: 800; margin-bottom: 4px; }
.feedback .fb-body { color: var(--ink); }
.timer { font-weight: 800; color: var(--accent); font-size: 15px; }
.result-card { text-align: center; padding: 26px 16px; }
.result-score { font-size: 40px; font-weight: 800; color: var(--primary); }
.result-sub { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }

/* ── 我的 ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 10px 6px; text-align: center; }
.stat-cell .sv { font-size: 18px; font-weight: 800; color: var(--primary); }
.stat-cell .sl { font-size: 11px; color: var(--muted); margin-top: 2px; }
.mastery-bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; background: var(--border); }
.mastery-bar span { height: 100%; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.set-row:last-child { border-bottom: 0; }
.set-row .sl-label { font-weight: 600; }
.seg { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
.seg button { padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.toggle { width: 44px; height: 25px; border-radius: 999px; background: var(--border); position: relative; transition: background .15s; }
.toggle::after { content: ''; position: absolute; top: 2.5px; left: 2.5px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on { background: var(--primary); }
.toggle.on::after { left: 21px; }
.range { width: 130px; }
.err-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
.err-row:last-child { border-bottom: 0; }

/* ── 词库维护 ── */
.admin-row { border-top: 1px solid var(--border); padding: 10px 0; }
.admin-row:first-of-type { border-top: 0; }
.admin-id { font-size: 12px; color: var(--faint); font-family: Consolas, monospace; }
.admin-actions { display: flex; gap: 8px; margin-top: 8px; }
.form-grid { display: grid; gap: 10px; }
.form-grid label { font-size: 13px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 4px; }
.form-grid input, .form-grid select, .form-grid textarea {
  width: 100%; border: 1.5px solid var(--border); border-radius: var(--radius-s); padding: 9px 11px; background: var(--bg); font-size: 14px;
}
.form-grid textarea { min-height: 84px; resize: vertical; }
.form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus { outline: none; border-color: var(--primary); background: #fff; }
.hint { font-size: 12px; color: var(--faint); margin-top: 4px; }

/* ── 弹层 ── */
.modal-mask { position: fixed; inset: 0; background: rgba(15, 28, 38, .45); z-index: 70; display: none; align-items: flex-end; justify-content: center; }
.modal-mask.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto; padding: 18px 16px 26px; }
.modal h3 { font-size: 16.5px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { color: var(--faint); font-size: 20px; padding: 2px 6px; }
@media (min-width: 500px) { .modal-mask.open { align-items: center; } .modal { border-radius: 16px; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%); background: rgba(23, 36, 47, .92); color: #fff; border-radius: 999px; padding: 9px 18px; font-size: 13px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86vw; text-align: center; }
.toast.show { opacity: 1; }
@media (max-width: 420px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }

</style>
</head>
<body>

<header class="appbar">
  <div class="wrap">
    <div class="brand">
      <div>
        <div class="brand-name">LEXI</div>
        <div class="brand-sub">易混词辨析 · 拼写 / 发音 / 词义</div>
      </div>
    </div>
    <div class="appbar-stats" id="appbar-stats"></div>
  </div>
</header>

<main>
  <!-- 首页 -->
  <section class="page active" id="page-home">
    <div class="wrap">
      <div class="hero">
        <div class="hero-box">
          <div class="hero-title">输入两个单词，立即辨析</div>
          <div class="hero-sub">自动对比拼写差异、音标发音、词义语境</div>
          <div class="compare-inputs">
            <input id="cmp-w1" type="text" placeholder="单词 1，如 affect" autocapitalize="off" autocomplete="off" spellcheck="false">
            <button class="swap-btn" id="cmp-swap" title="交换">⇄</button>
            <input id="cmp-w2" type="text" placeholder="单词 2，如 effect" autocapitalize="off" autocomplete="off" spellcheck="false">
          </div>
          <div style="height:10px"></div>
          <button class="btn block" id="cmp-go">开始对比辨析</button>
        </div>
      </div>

      <div class="search-box">
        <div class="search-wrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search-input" type="text" placeholder="在词库中查词：affect / stationery / weather" autocapitalize="off" autocomplete="off" spellcheck="false">
        </div>
        <ul class="suggestions" id="suggestions" hidden></ul>
      </div>
      <div class="hotwords" id="hotwords"></div>
      <div id="search-results"></div>
    </div>
  </section>

  <!-- 词库 -->
  <section class="page" id="page-library">
    <div class="wrap">
      <div class="chips" id="lib-tabs">
        <button class="chip active" data-lib="all">全部词条</button>
        <button class="chip" data-lib="fav">我的收藏</button>
        <button class="chip" data-lib="admin">词库维护</button>
      </div>
      <div id="lib-all">
        <div class="chips" id="level-filter"></div>
        <div class="chips" id="type-filter"></div>
        <div id="browse-list"></div>
      </div>
      <div id="lib-fav" hidden></div>
      <div id="lib-admin" hidden></div>
    </div>

<script>
/* LEXI core —— 状态 / 存储 / TTS / 词典 API / 差异高亮 / 公共渲染 */
(function () {
  'use strict';
  var LEVELS = ['小学', '初中', '高中', '四级', '六级'];
  var TYPE_ALL = ['拼写相似', '发音相似', '词义相近'];
  var HOT = ['affect', 'quite', 'adapt', 'stationery', 'weather', 'access', 'price', 'desert'];

  function loadJSON(id) {
    try { return JSON.parse(document.getElementById(id).textContent); }
    catch (e) { console.error('数据解析失败', id, e); return null; }
  }

  // ── 存储 ──
  var LS = {
    get: function (k, def) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
      catch (e) { return def; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var bank = LS.get('yhbank_v1', null) || loadJSON('bank-data') || [];
  var types = loadJSON('types-data') || {};
  var pairs = loadJSON('pairs-data') || [];
  var examples = loadJSON('examples-data') || {};
  var bankOverridden = !!LS.get('yhbank_v1', null);

  var settings = LS.get('yh_settings_v1', { accent: 'US', rate: 0.9, autoSpeak: true });
  var favs = LS.get('yh_fav_v1', []);
  var notes = LS.get('yh_notes_v1', {});
  var customs = LS.get('yh_custom_v1', []);
  var hist = LS.get('yh_hist_v1', []);
  var dictCache = LS.get('yh_dict_v1', {});

  function saveSettings() { LS.set('yh_settings_v1', settings); }
  function saveFavs() { LS.set('yh_fav_v1', favs); }
  function saveNotes() { LS.set('yh_notes_v1', notes); }
  function saveCustoms() { LS.set('yh_custom_v1', customs); }
  function saveHist() {
    if (hist.length > 600) hist = hist.slice(hist.length - 600);
    LS.set('yh_hist_v1', hist);
  }
  function saveDict() {
    var keys = Object.keys(dictCache);
    if (keys.length > 400) {
      var keep = {}; keys.slice(-400).forEach(function (k) { keep[k] = dictCache[k]; });
      dictCache = keep;
    }
    LS.set('yh_dict_v1', dictCache);
  }

  // ── 工具 ──
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normWord(w) {
    return String(w || '').toLowerCase().replace(/[^a-z0-9'’\-\s]/g, '').trim();
  }
  function levelIdx(l) { return LEVELS.indexOf(l); }
  function findGroupOf(word) {
    var q = normWord(word);
    for (var i = 0; i < bank.length; i++) {
      for (var j = 0; j < bank[i].words.length; j++) {
        if (normWord(bank[i].words[j].word) === q) return bank[i];
      }
    }
    return null;
  }
  function findWordInBank(word) {
    var g = findGroupOf(word);
    if (!g) return null;
    var q = normWord(word);
    for (var j = 0; j < g.words.length; j++) {
      if (normWord(g.words[j].word) === q) return { group: g, w: g.words[j] };
    }
    return null;
  }
  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayStrOf(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ── 字符差异（LCS 对齐）──
  function charDiff(a, b) {
    // 返回 {a: [{ch, same}], b: [...]}：差异字符 same=false
    var la = a.length, lb = b.length;
    var dp = [];
    for (var i = 0; i <= la; i++) { dp.push(new Array(lb + 1).fill(0)); }
    for (i = la - 1; i >= 0; i--) {
      for (var j = lb - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var ra = [], rb = [];
    i = 0; j = 0;
    while (i < la && j < lb) {
      if (a[i] === b[j]) { ra.push({ ch: a[i], same: true }); rb.push({ ch: b[j], same: true }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ra.push({ ch: a[i], same: false }); i++; }
      else { rb.push({ ch: b[j], same: false }); j++; }
    }
    while (i < la) { ra.push({ ch: a[i], same: false }); i++; }
    while (j < lb) { rb.push({ ch: b[j], same: false }); j++; }
    var da = ra.filter(function (x) { return !x.same; }).length;
    var db = rb.filter(function (x) { return !x.same; }).length;
    return { a: ra, b: rb, count: da + db, positions: Math.max(da, db) };
  }
  function renderDiff(tokens) {
    var out = tokens.map(function (t) {
      return t.same ? esc(t.ch) : '<span class="diff-mark">' + esc(t.ch) + '</span>';
    }).join('');
    return out;
  }
  function markDiff(wordA, wordB) {
    var d = charDiff(wordA.toLowerCase(), wordB.toLowerCase());
    return {
      a: renderDiff(d.a), b: renderDiff(d.b), count: d.count, positions: d.positions,
      sameLen: wordA.length === wordB.length
    };
  }
  // 按单词首字母对齐的高亮（用于同组内任意两个词的差异，以基准词视角）
  function diffAgainst(base, others) {
    return others.map(function (o) {
      var m = markDiff(base, o);
      return { html: m.b, count: m.count };
    });
  }

  // ── IPA 差异 ──
  function ipaTokens(ipa) {
    // 去掉重音符号做对比，但保留展示原文
    return { raw: ipa, cmp: ipa.replace(/[ˈˌ]/g, '') };
  }
  function ipaDiffView(ipaA, ipaB) {
    var A = ipaTokens(ipaA), B = ipaTokens(ipaB);
    var m = markDiff(A.cmp, B.cmp);
    // markDiff 产出的是 cmp 视角的字符流，IPA 本身就是小写符号，无需恢复大小写
    return { a: m.a, b: m.b, count: m.count, positions: m.positions };
  }

  // ── TTS 发音引擎 ──
  var TTS = {
    ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
    voices: [],
    _pickVoice: function (accent) {
      if (!this.voices.length) this.voices = speechSynthesis.getVoices() || [];
      var want = accent === 'UK' ? ['en-GB'] : ['en-US'];
      var pool = this.voices.filter(function (v) { return want.indexOf(v.lang) !== -1 || v.lang.replace('_', '-') === want[0]; });
      if (!pool.length) pool = this.voices.filter(function (v) { return /^en/i.test(v.lang); });
      if (!pool.length) return null;
      var prefer = pool.filter(function (v) { return /female|Samantha|Zira|Google US|Google UK/i.test(v.name); });
      return (prefer[0] || pool[0]);
    },
    speak: function (text, opts) {
      opts = opts || {};
      if (!this.ok) { toast('当前浏览器不支持语音合成'); return; }
      try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = (opts.accent || settings.accent) === 'UK' ? 'en-GB' : 'en-US';
        u.rate = opts.rate || settings.rate;
        var v = this._pickVoice(opts.accent || settings.accent);
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      } catch (e) { toast('发音失败：' + e.message); }
    },
    stop: function () { if (this.ok) { try { speechSynthesis.cancel(); } catch (e) {} } },
    _loopTimer: null,
    _looping: false,
    speakPairLoop: function (a, b, accent) {
      var self = this;
      this.stop();
      this._looping = true;
      var step = 0;
      function next() {
        if (!self._looping) return;
        var w = step % 2 === 0 ? a : b;
        try {
          speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(w);
          u.lang = accent === 'UK' ? 'en-GB' : 'en-US';
          u.rate = settings.rate;
          var v = self._pickVoice(accent || settings.accent);
          if (v) u.voice = v;
          u.onend = function () {
            if (!self._looping) return;
            self._loopTimer = setTimeout(next, 700);
          };
          speechSynthesis.speak(u);
        } catch (e) { self._looping = false; }
        step++;
      }
      next();
    },
    stopLoop: function () { this._looping = false; clearTimeout(this._loopTimer); this.stop(); },
    speakSeq: function (words, done) {
      var self = this;
      this.stop();
      var i = 0;
      function next() {
        if (i >= words.length) { if (done) done(); return; }
        var w = words[i++];
        try {
          var u = new SpeechSynthesisUtterance(w);
          u.lang = settings.accent === 'UK' ? 'en-GB' : 'en-US';
          u.rate = settings.rate;
          var v = self._pickVoice(settings.accent);
          if (v) u.voice = v;
          u.onend = function () { setTimeout(next, 350); };
          u.onerror = function () { setTimeout(next, 150); };
          speechSynthesis.speak(u);
        } catch (e) { i = words.length; next(); }
      }
      next();
    }
  };
  if (TTS.ok) {
    speechSynthesis.onvoiceschanged = function () { TTS.voices = speechSynthesis.getVoices() || []; };
    TTS.voices = speechSynthesis.getVoices() || [];
  }

  // ── 在线词典（Free Dictionary API）──
  var DICT = {
    online: function () { return navigator.onLine !== false; },
    lookup: function (word) {
      var key = normWord(word);
      if (!key) return Promise.resolve(null);
      if (dictCache[key]) return Promise.resolve(dictCache[key]);
      if (!this.online()) return Promise.resolve({ error: '离线，且本地词库未收录该词' });
      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(key), ctrl ? { signal: ctrl.signal } : {})
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (arr) {
          if (timer) clearTimeout(timer);
          if (!Array.isArray(arr) || !arr.length) throw new Error('无结果');
          var e = arr[0];
          var out = { word: e.word || key, ipa: '', audio: '', defs: [], src: 'dict' };
          (e.phonetics || []).concat(e.phonetic ? [{ text: e.phonetic }] : []).some(function (p) {
            if (p.text && !out.ipa) out.ipa = p.text;
            if (p.audio && !out.audio) out.audio = p.audio;
            return out.ipa && out.audio;
          });
          (e.meanings || []).slice(0, 4).forEach(function (m) {
            var d0 = (m.definitions || [])[0] || {};
            out.defs.push({ pos: m.partOfSpeech || '', def: d0.definition || '', ex: d0.example || '' });
          });
          dictCache[key] = out;
          saveDict();
          return out;
        })
        .catch(function (err) {
          if (timer) clearTimeout(timer);
          var msg = err && err.name === 'AbortError' ? '查询超时' : '词典服务不可用';
          return { error: msg };
        });
    },
    playAudio: function (url, fallbackWord) {
      if (!url) { TTS.speak(fallbackWord); return; }
      try {
        var au = new Audio(url);
        au.play().catch(function () { TTS.speak(fallbackWord); });
      } catch (e) { TTS.speak(fallbackWord); }
    }
  };

  // ── 类型标签 ──
  var openGroups = {};
  function typesOf(g) {
    if (g._types) return g._types;
    var t = types[g.id];
    if (!t) {
      // 自定义组等：现场计算拼写相似兜底
      var ws = g.words.map(function (w) { return normWord(w.word); });
      var min = 9;
      for (var i = 0; i < ws.length; i++) for (var j = i + 1; j < ws.length; j++) {
        var d = charDiff(ws[i], ws[j]);
        var dl = d.a.filter(function (x) { return !x.same; }).length;
        min = Math.min(min, dl);
      }
      t = [min <= 2 ? '拼写相似' : '词义相近'];
    }
    g._types = t;
    return t;
  }

  // ── 收藏 ──
  function isFav(id) { return favs.indexOf(id) !== -1; }
  function toggleFav(id) {
    var i = favs.indexOf(id);

  // ── 公共渲染 ──
  function badgeHtml(g) {
    var t = typesOf(g).map(function (x) { return '<span class="badge b-type">' + esc(x) + '</span>'; }).join('');
    return '<span class="badge b-level">' + esc(g.level) + '</span>' + t;
  }
  function playBtn(word) {
    return '<button class="play-btn" data-play="' + esc(word) + '" title="播放">' +
