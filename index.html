<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>易混词汇查词</title>
<style>
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --border: #dfe4ea;
  --ink: #1c2733;
  --muted: #5b6b7b;
  --primary: #0f766e;
  --primary-weak: #e6f4f3;
  --accent: #b45309;
  --danger: #be123c;
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 18px;
  padding-bottom: 14px;
}
.brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0;
}
.brand-sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}
.stats {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
}
.stats b { color: var(--ink); }

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-top: 16px;
}
.tab {
  border: 0;
  background: transparent;
  padding: 10px 16px;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-weight: 600;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.tabpanel { padding: 18px 0 28px; }

.searchbox { position: relative; }
.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px;
  transition: border-color .15s, box-shadow .15s;
}
.search-input-wrap:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(15, 118, 110, .14);
}
.search-icon { display: flex; flex: 0 0 auto; color: var(--muted); }
#search-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 48px;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 17px;
}
.clear-btn {
  border: 0;
  background: #eef1f4;
  color: var(--muted);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  flex: 0 0 auto;
  font-size: 16px;
  line-height: 1;
}
.clear-btn:hover { color: var(--ink); }

.suggestions {
  list-style: none;
  margin: 6px 0 0;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 20px rgba(28, 39, 51, .1);
  position: absolute;
  left: 0;
  right: 0;
  top: 56px;
  z-index: 20;
  max-height: 320px;
  overflow: auto;
}
.suggestions li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.suggestions li:hover { background: var(--primary-weak); }
.sug-word { font-weight: 600; min-width: 110px; }
.sug-ipa { color: var(--muted); font-size: 12px; min-width: 84px; }
.sug-mean {
  flex: 1 1 auto;
  min-width: 0;
  color: var(--muted);
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  color: var(--muted);
}
.chip:hover { color: var(--primary); border-color: var(--primary); }

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin: 16px 0;
}
.filter-label {
  font-size: 13px;
  color: var(--muted);
}
.seg {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  flex-wrap: wrap;
}
.seg-btn {
  border: 0;
  background: transparent;
  padding: 7px 14px;
  font-size: 13px;
  color: var(--muted);
  border-right: 1px solid var(--border);
}
.seg-btn:last-child { border-right: 0; }
.seg-btn:hover { color: var(--ink); background: #f7f9fb; }
.seg-btn.active {
  background: var(--primary);
  color: #fff;
}

.result-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 13px;
  margin: 4px 0 10px;
}
.empty {
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--muted);
  padding: 26px 18px;
  text-align: center;
}

.group {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.group-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  margin-bottom: 10px;
}
.group-words {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  word-break: break-word;
}
.group-words mark {
  background: #fde68a;
  color: inherit;
  border-radius: 3px;
  padding: 0 2px;
}
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.b-level { color: #fff; }
.b-level.lv0 { background: #15803d; }
.b-level.lv1 { background: #0369a1; }
.b-level.lv2 { background: #6d28d9; }
.b-level.lv3 { background: #b45309; }
.b-level.lv4 { background: #be123c; }
.b-source { background: #eef1f4; color: #475569; }

.word-list { display: grid; gap: 6px; margin: 0 0 10px; }
.word-row {
  display: grid;
  grid-template-columns: minmax(150px, 220px) 1fr;
  gap: 8px 14px;
  align-items: baseline;
}
.word-en { font-weight: 600; overflow-wrap: anywhere; }
.word-pos { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 13px; }
.word-ipa { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 13px; }
.word-mean { color: #33414f; }
.note {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  color: #33414f;
  font-size: 14px;
}
.note b { color: var(--primary); font-weight: 600; }

.browse-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 18px 0 10px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border);
}
.browse-head .bh-title { font-size: 17px; font-weight: 700; }
.browse-head .bh-count { color: var(--muted); font-size: 13px; }
.fuzzy-head {
  margin: 18px 0 10px;
  padding: 8px 12px;
  background: #fff8e6;
  border: 1px solid #f0d9a8;
  border-radius: var(--radius);
  color: #7c4a03;
  font-size: 13px;
  font-weight: 600;
}
.group.compact .word-row { grid-template-columns: minmax(130px, 200px) 1fr; }
.group.compact .word-row { font-size: 14px; }
.group.compact .note { font-size: 13px; }
.group.compact .word-en { cursor: pointer; }
.group.compact .word-en:hover { color: var(--primary); text-decoration: underline; }

.admin-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #0d6a63; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; font-weight: 500; }

.admin-form, .admin-import {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}
.field label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  background: #fff;
}
.field textarea { resize: vertical; min-height: 90px; }
.form-actions { display: flex; gap: 10px; }
.form-hint { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.admin-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.admin-row .group-top { margin-bottom: 6px; }
.admin-row .note { border-top: 0; padding-top: 0; font-size: 13px; }
.admin-actions { display: flex; gap: 8px; margin-top: 8px; }
.admin-id { color: var(--muted); font-size: 12px; }
.message {
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 14px;
}
.message.ok { background: #e8f5ee; color: #14532d; border: 1px solid #bbdfca; }
.message.err { background: #fdecef; color: #9f1239; border: 1px solid #f3c0ca; }

footer {
  border-top: 1px solid var(--border);
  padding: 18px 0 30px;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 720px) {
  .wrap { padding: 0 14px; }
  .topbar-inner { flex-direction: column; align-items: flex-start; gap: 6px; }
  .stats { white-space: normal; }
  .tab { flex: 1 1 0; text-align: center; padding: 10px 6px; }
  .word-row { grid-template-columns: 1fr; gap: 2px; }
  .group.compact .word-row { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .sug-word { min-width: 90px; }
}
</style>

<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-name">易混词汇查词</div>
        <div class="brand-sub">小学 → 六级 · 人教/译林词库</div>
      </div>
    </div>
    <div class="stats" id="stat-groups">词条 <b>0</b> 组 · 单词 <b>0</b> 个</div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="search" role="tab">查词</button>
    <button class="tab" data-tab="browse" role="tab">全部词条</button>
    <button class="tab" data-tab="admin" role="tab">词库维护</button>
  </nav>

  <section id="tab-search" class="tabpanel" data-panel="search">
    <div class="searchbox">
      <div class="search-input-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        </span>
        <input id="search-input" type="search" placeholder="输入单词，如 affect、quite" autocomplete="off" aria-label="输入单词">
        <button id="search-clear" class="clear-btn" title="清空" hidden>&times;</button>
      </div>
      <ul id="suggestions" class="suggestions" hidden></ul>
      <div class="chips" id="search-chips">
        <button class="chip" data-sample="affect">affect</button>
        <button class="chip" data-sample="quite">quite</button>
        <button class="chip" data-sample="adapt">adapt</button>
        <button class="chip" data-sample="stationery">stationery</button>
        <button class="chip" data-sample="weather">weather</button>
      </div>
    </div>
    <div class="filters">
      <span class="filter-label">难度筛选</span>
      <div class="seg" id="level-filter-search"></div>
    </div>
    <div id="search-results"></div>
  </section>

  <section id="tab-browse" class="tabpanel" data-panel="browse" hidden>
    <div class="filters">
      <span class="filter-label">难度筛选</span>
      <div class="seg" id="level-filter-browse"></div>
      <div class="seg" id="browse-mode">
        <button class="seg-btn active" data-mode="letter">按字母</button>
        <button class="seg-btn" data-mode="level">按难度</button>
      </div>
    </div>
    <div id="browse-list"></div>
  </section>

  <section id="tab-admin" class="tabpanel" data-panel="admin" hidden>
    <div class="admin-bar">
      <button class="btn primary" id="btn-add">新增词条</button>
      <button class="btn" id="btn-export">导出词库</button>
      <button class="btn" id="btn-import">导入词库</button>
      <button class="btn danger" id="btn-reset">恢复内置</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div id="admin-message"></div>

":"sigh","pos":"v.","meaning":"叹气","ipa":"/saɪ/"}],"note":"sign 是“标志”，sigh 是“叹气”，读音不同。"},{"id":"g367","level":"高中","source":"其他教材","words":[{"word":"treat","pos":"v.","meaning":"对待；治疗","ipa":"/triːt/"},{"word":"threat","pos":"n.","meaning":"威胁","ipa":"/θret/"}],"note":"treat 是“对待/治疗”，threat 是“威胁”，拼写相近。"},{"id":"g368","level":"高中","source":"其他教材","words":[{"word":"series","pos":"n.","meaning":"系列","ipa":"/ˈsɪəriːz/"},{"word":"serious","pos":"adj.","meaning":"严肃的","ipa":"/ˈsɪəriəs/"}],"note":"series 是“系列”，serious 是“严肃的”，拼写相近。"},{"id":"g369","level":"高中","source":"其他教材","words":[{"word":"poor","pos":"adj.","meaning":"穷的","ipa":"/pɔː(r)/"},{"word":"pour","pos":"v.","meaning":"倒；倾泻","ipa":"/pɔː(r)/"},{"word":"pore","pos":"n.","meaning":"毛孔","ipa":"/pɔː(r)/"}],"note":"poor 是“穷的”，pour 是“倒”，pore 是“毛孔”，读音相同。"},{"id":"g370","level":"高中","source":"其他教材","words":[{"word":"die","pos":"v.","meaning":"死","ipa":"/daɪ/"},{"word":"dye","pos":"v.","meaning":"染色","ipa":"/daɪ/"}],"note":"die 是“死”，dye 是“染色”，读音相同。"},{"id":"g371","level":"高中","source":"其他教材","words":[{"word":"quite","pos":"adv.","meaning":"相当","ipa":"/kwaɪt/"},{"word":"quote","pos":"v.","meaning":"引用","ipa":"/kwəʊt/"}],"note":"quite 是副词“相当”，quote 是动词“引用”，拼写相近。"},{"id":"g372","level":"四级","source":"四六级词表","words":[{"word":"mail","pos":"n.","meaning":"邮件","ipa":"/meɪl/"},{"word":"male","pos":"adj.","meaning":"男性的","ipa":"/meɪl/"}],"note":"mail 是“邮件”，male 是“男性的”，读音相同。"},{"id":"g373","level":"四级","source":"四六级词表","words":[{"word":"waste","pos":"v./n.","meaning":"浪费","ipa":"/weɪst/"},{"word":"waist","pos":"n.","meaning":"腰","ipa":"/weɪst/"}],"note":"waste 是“浪费”，waist 是“腰”，读音相同。"},{"id":"g374","level":"四级","source":"四六级词表","words":[{"word":"cereal","pos":"n.","meaning":"麦片","ipa":"/ˈsɪəriəl/"},{"word":"serial","pos":"adj./n.","meaning":"连续的；连续剧","ipa":"/ˈsɪəriəl/"}],"note":"cereal 是“麦片”，serial 是“连续剧”，读音相同。"}]
</script>
<script>
(function () {
  'use strict';

  var LEVELS = ['小学', '初中', '高中', '四级', '六级'];
  var LS_KEY = 'yhbank_v1';
  var builtin = JSON.parse(document.getElementById('wordbank-data').textContent);
  var bank = loadBank();
  var levelFilter = '全部';
  var browseMode = 'letter';
  var editingId = null;

  var $ = function (id) { return document.getElementById(id); };
  var searchInput = $('search-input');
  var suggestionsEl = $('suggestions');
  var searchResults = $('search-results');
  var browseList = $('browse-list');
  var adminList = $('admin-list');

  function loadBank() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) return parsed;
      }
    } catch (e) {}
    return builtin.slice();
  }

  function saveBank() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(bank)); } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normWord(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9'\u2019\-\s]/g, '').trim().replace(/\s+/g, ' ');
  }

  function levelIdx(level) {
    return Math.max(0, LEVELS.indexOf(level));
  }

  function badgeHtml(group, compact) {
    return '<span class="badge b-level lv' + levelIdx(group.level) + '">' + esc(group.level) + '</span>' +
           '<span class="badge b-source">' + esc(group.source) + '</span>';
  }

  function wordsSummary(group) {
    return group.words.map(function (w) { return esc(w.word); }).join(' / ');
  }

  function wordListHtml(group, query) {
    var q = normWord(query || '');
    var rows = group.words.map(function (w) {
      var en = esc(w.word);
      if (q && normWord(w.word).indexOf(q) !== -1) {
        en = esc(w.word).replace(new RegExp('(' + escReg(q) + ')', 'ig'), '<mark>$1</mark>');
      }
      var ipa = w.ipa ? '<span class="word-ipa">' + esc(w.ipa) + '</span>' : '';
      var pos = w.pos ? '<span class="word-pos">' + esc(w.pos) + '</span>' : '';
      return '<div class="word-row"><span class="word-en" data-word="' + esc(w.word) + '">' + en + ipa + pos + '</span>' +
             '<span class="word-mean">' + esc(w.meaning) + '</span></div>';
    }).join('');
    return '<div class="word-list">' + rows + '</div>';
  }

  function escReg(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function groupCard(group, query, compact) {
    var cls = compact ? 'group compact' : 'group';
    return '<article class="' + cls + '" data-id="' + esc(group.id) + '">' +
      '<div class="group-top">' +
        '<h3 class="group-words">' + wordsSummary(group) + '</h3>' +
        badgeHtml(group) +
      '</div>' +
      wordListHtml(group, query) +
      '<div class="note"><b>辨析：</b>' + esc(group.note) + '</div>' +
    '</article>';
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    var prev = new Array(lb + 1), cur = new Array(lb + 1);
    for (var j = 0; j <= lb; j++) prev[j] = j;
    for (var i = 1; i <= la; i++) {
      cur[0] = i;
      for (var j = 1; j <= lb; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[lb];
  }

  function matchGroup(group, q) {
    var bestTier = Infinity;
    var bestScore = Infinity;
    var matched = '';
    group.words.forEach(function (w) {
      var wl = normWord(w.word);
      if (!wl) return;
      var tier, score;
      if (wl === q) { tier = 0; score = 0; }
      else if (wl.indexOf(q) === 0 || (q.indexOf(wl) === 0 && wl.length >= 4)) { tier = 1; score = 1; }
      else if (wl.indexOf(q) !== -1 && (q.length >= 4 || wl.length - q.length <= 2)) { tier = 2; score = 2; }
      else {
        var d = levenshtein(wl, q);
        var maxD = q.length >= 5 ? 2 : 1;
        if (d > maxD) return;
        if (q.length <= 4 && (wl.length !== q.length || wl.charAt(0) !== q.charAt(0))) return;
        tier = 3;
        score = 3 + d;
      }
      if (tier < bestTier || (tier === bestTier && score < bestScore)) {
        bestTier = tier;
        bestScore = score;
        matched = wl;
      }
    });
    if (bestTier === Infinity) return null;
    return { tier: bestTier, score: bestScore, matched: matched };
  }

  function filteredBank() {
    if (levelFilter === '全部') return bank;
    return bank.filter(function (g) { return g.level === levelFilter; });
  }

  function runSearch() {
    var q = normWord(searchInput.value);
    if (!q) {
      renderSearchEmpty();
      return;
    }
    var exact = [];
    var fuzzy = [];
    filteredBank().forEach(function (g) {
      var r = matchGroup(g, q);
      if (!r) return;
      var item = { g: g, tier: r.tier, score: r.score };
      (r.tier <= 2 ? exact : fuzzy).push(item);
    });
    function sortHits(a, b) {
      if (a.tier !== b.tier) return a.tier - b.tier;
      if (a.score !== b.score) return a.score - b.score;
      var la = a.g.level === levelFilter ? 0 : 1;
      var lb = b.g.level === levelFilter ? 0 : 1;
      if (la !== lb) return la - lb;
      return a.g.id.localeCompare(b.g.id);
    }
    exact.sort(sortHits);
    fuzzy.sort(sortHits);
    var html = '';
    if (exact.length || fuzzy.length) {
      html += '<div class="result-head"><span>直接命中 ' + exact.length + ' 组' +
        (fuzzy.length ? ' · 相近拼写 ' + fuzzy.length + ' 组' : '') + '</span>' +
        (levelFilter !== '全部' ? '<span>当前难度：' + esc(levelFilter) + '</span>' : '') + '</div>';
    }
    if (!exact.length && !fuzzy.length) {
      html += '<div class="empty">未找到相关词条，可尝试相近拼写或切换难度。</div>';
    } else {
      exact.slice(0, 40).forEach(function (h) { html += groupCard(h.g, q, false); });
      if (fuzzy.length) {
        html += '<div class="fuzzy-head">相近拼写（近似匹配，供参考）</div>';
        fuzzy.slice(0, 8).forEach(function (h) { html += groupCard(h.g, q, true); });
      }
    }
    searchResults.innerHTML = html;
  }

  function renderSearchEmpty() {
    var pool = filteredBank();
    searchResults.innerHTML =
      '<div class="result-head"><span>共 ' + pool.length + ' 组词条</span></div>' +
      '<div class="empty">输入单词后，会匹配与之相关的易混词条。</div>';
  }

  function renderSuggestions() {
    var q = normWord(searchInput.value);
    if (!q) { suggestionsEl.hidden = true; return; }
    var seen = {};
    var items = [];
    filteredBank().forEach(function (g) {
      g.words.forEach(function (w) {
        var wl = normWord(w.word);
        if (!wl || seen[wl]) return;
        var score = wl.indexOf(q) === 0 ? 0 :
          (wl.indexOf(q) !== -1 && (q.length >= 4 || wl.length - q.length <= 2) ? 1 : 2);
        if (score > 1) return;
        seen[wl] = true;
        items.push({ w: w, wl: wl, level: g.level, score: score });
      });
    });
    items.sort(function (a, b) {
      if (a.score !== b.score) return a.score - b.score;
      return a.wl.length - b.wl.length;
    });
    items = items.slice(0, 8);
    if (!items.length) { suggestionsEl.hidden = true; return; }
    suggestionsEl.innerHTML = items.map(function (it) {
      return '<li data-word="' + esc(it.w.word) + '">' +
        '<span class="sug-word">' + esc(it.w.word) + '</span>' +
        '<span class="sug-ipa">' + (it.w.ipa ? esc(it.w.ipa) : '') + '</span>' +
        '<span class="sug-mean">' + esc(it.w.meaning) + '</span>' +
        '<span class="badge b-level lv' + levelIdx(it.level) + '">' + esc(it.level) + '</span>' +
      '</li>';
    }).join('');
    suggestionsEl.hidden = false;
  }

  function renderBrowse() {
    var pool = filteredBank();
    var html = '<div class="result-head"><span>共 ' + pool.length + ' 组词条</span></div>';
    if (!pool.length) {
      html += '<div class="empty">当前难度下暂无词条。</div>';
      browseList.innerHTML = html;
      return;
    }
    var groups = {};
    if (browseMode === 'level') {
      LEVELS.forEach(function (lv) { groups[lv] = []; });
      pool.forEach(function (g) { groups[g.level].push(g); });
      Object.keys(groups).forEach(function (key) {
        var list = groups[key];
        if (!list.length) return;
        html += '<div class="browse-head"><span class="bh-title">' + esc(key) + '</span>' +
          '<span class="bh-count">' + list.length + ' 组</span></div>';
        list.forEach(function (g) { html += groupCard(g, '', true); });
      });
    } else {
      pool.forEach(function (g) {
        var first = normWord(g.words[0].word).charAt(0);
        var key = /[a-z]/.test(first) ? first.toUpperCase() : '#';
        (groups[key] = groups[key] || []).push(g);
      });
      Object.keys(groups).sort().forEach(function (key) {
        html += '<div class="browse-head"><span class="bh-title">' + esc(key) + '</span>' +
          '<span class="bh-count">' + groups[key].length + ' 组</span></div>';
        groups[key].forEach(function (g) { html += groupCard(g, '', true); });
      });
    }
    browseList.innerHTML = html;
  }

  function renderStats() {
    var words = {};
    bank.forEach(function (g) {
      g.words.forEach(function (w) { words[normWord(w.word)] = true; });
    });
    $('stat-groups').innerHTML = '词条 <b>' + bank.length + '</b> 组 · 单词 <b>' +
      Object.keys(words).length + '</b> 个';
  }

  function renderLevelFilters() {
    var opts = ['全部'].concat(LEVELS);
    ['level-filter-search', 'level-filter-browse'].forEach(function (id) {
      var el = $(id);
      el.innerHTML = opts.map(function (lv) {
        return '<button class="seg-btn' + (lv === levelFilter ? ' active' : '') + '" data-level="' + lv + '">' + lv + '</button>';
      }).join('');
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab);
    });
    document.querySelectorAll('.tabpanel').forEach(function (p) {
      p.hidden = p.getAttribute('data-panel') !== tab;
    });
    if (tab === 'search') runSearch();
    if (tab === 'browse') renderBrowse();
    if (tab === 'admin') renderAdmin();
  }

  function message(text, type) {
    var el = $('admin-message');
    el.innerHTML = '<div class="message ' + (type === 'err' ? 'err' : 'ok') + '">' + esc(text) + '</div>';
    setTimeout(function () { el.innerHTML = ''; }, 4000);
  }

  function validateGroup(g, isNew) {
    if (!g || typeof g !== 'object') return '词条格式错误';
    if (!g.id) return '缺少编号';
    if (LEVELS.indexOf(g.level) === -1) return '难度不合法：' + g.level;
    if (!g.words || !Array.isArray(g.words) || g.words.length < 2) return '每组至少需要两个单词';
    if (!g.note || !String(g.note).trim()) return '缺少辨析要点';
    var seen = {};
    for (var i = 0; i < g.words.length; i++) {
      var w = g.words[i];
      if (!w || !w.word || !String(w.word).trim()) return '存在空单词';
      if (!w.meaning || !String(w.meaning).trim()) return '单词 ' + w.word + ' 缺少释义';
      var k = normWord(w.word);
      if (!k) return '单词 ' + w.word + ' 不合法';
      if (seen[k]) return '同组内单词重复：' + w.word;
      seen[k] = true;
    }
    if (isNew) {
      for (var j = 0; j < bank.length; j++) {
        if (bank[j].id === g.id) return '编号已存在：' + g.id;
      }
    }
    return null;
  }

  function nextId() {
    var max = 0;
    bank.forEach(function (g) {
      var m = String(g.id).match(/^g(\d+)$/);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'g' + String(max + 1).padStart(3, '0');
  }

  function parseWordsText(text) {
    var lines = String(text).split(/\r?\n/);
    var words = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var parts = line.split('|').map(function (s) { return s.trim(); });
      if (parts.length < 2) return { error: '第 ' + (i + 1) + ' 行格式错误（应为 单词|释义）' };
      if (!parts[0]) return { error: '第 ' + (i + 1) + ' 行缺少单词' };
      var item = { word: parts[0], pos: '', ipa: '', meaning: '' };
      if (parts.length >= 4) {
        item.pos = parts[1];
        item.ipa = parts[2];
        item.meaning = parts[3];
      } else if (parts.length === 3) {
        item.pos = parts[1];
        item.meaning = parts[2];
      } else {
        item.meaning = parts[1];
      }
      if (!item.meaning) return { error: '第 ' + (i + 1) + ' 行缺少释义' };
      words.push(item);
    }
    if (words.length < 2) return { error: '至少需要两个单词' };
    return { words: words };
  }

  function wordsToText(group) {
    return group.words.map(function (w) {
      return w.word + '|' + (w.pos || '') + '|' + (w.ipa || '') + '|' + w.meaning;
    }).join('\n');
  }

  function renderAdmin() {
    var html = '<div class="result-head"><span>共 ' + bank.length + ' 组词条</span></div>';
    bank.forEach(function (g) {
      html += '<div class="admin-row" data-id="' + esc(g.id) + '">' +
        '<div class="group-top"><span class="admin-id">' + esc(g.id) + '</span>' +
        badgeHtml(g) + '</div>' +
        '<div class="word-row"><span class="word-en">' + wordsSummary(g) + '</span><span class="word-mean"></span></div>' +
        '<div class="note"><b>辨析：</b>' + esc(g.note) + '</div>' +
        '<div class="admin-actions">' +
          '<button class="btn small" data-act="edit">编辑</button>' +
          '<button class="btn small danger" data-act="del">删除</button>' +
        '</div>' +
      '</div>';
    });
    adminList.innerHTML = html;
  }

  function openForm(group) {
    editingId = group ? group.id : null;
    $('admin-form').hidden = false;
    $('f-level').value = group ? group.level : '小学';
    $('f-source').value = group ? group.source : '人教/译林';
    $('f-id').value = group ? group.id : nextId();
    $('f-words').value = group ? wordsToText(group) : '';
    $('f-note').value = group ? group.note : '';
    $('f-hint').textContent = group ? '正在编辑：' + group.id : '新增词条';
  }

  function closeForm() {
    $('admin-form').hidden = true;
    editingId = null;
  }

  function saveForm() {
    var parsed = parseWordsText($('f-words').value);
    if (parsed.error) { message(parsed.error, 'err'); return; }
    var group = {
      id: $('f-id').value.trim() || nextId(),
      level: $('f-level').value,
      source: $('f-source').value,
      words: parsed.words,
      note: $('f-note').value.trim()
    };
    var err = validateGroup(group, !editingId);
    if (err) { message(err, 'err'); return; }
    if (editingId) {
      for (var i = 0; i < bank.length; i++) {
        if (bank[i].id === editingId) { bank[i] = group; break; }
      }
    } else {
      bank.push(group);
    }
    saveBank();
    closeForm();
    renderAdmin();
    renderStats();
    message('已保存', 'ok');
  }

  function exportBank() {
    var blob = new Blob([JSON.stringify(bank, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '易混词汇词库.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  function validateImport(data) {
    if (!Array.isArray(data) || !data.length) return 'JSON 内容不是有效的词条数组';
    var ids = {};
    for (var i = 0; i < data.length; i++) {
      var err = validateGroup(data[i], false);
      if (err) return '第 ' + (i + 1) + ' 条：' + err;
      if (ids[data[i].id]) return '编号重复：' + data[i].id;
      ids[data[i].id] = true;
    }
    return null;
  }

  function doImport(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { message('JSON 解析失败', 'err'); return; }
    var err = validateImport(data);
    if (err) { message('导入失败：' + err, 'err'); return; }
    if (!window.confirm('导入将替换当前全部 ' + bank.length + ' 组词条，是否继续？')) return;
    bank = data;
    saveBank();
    $('admin-import').hidden = true;
    $('import-text').value = '';
    renderAdmin();
    renderStats();
    renderLevelFilters();
    message('导入成功，共 ' + bank.length + ' 组', 'ok');
  }

  function resetBank() {
    if (!window.confirm('恢复内置词库将清除全部本地修改，是否继续？')) return;
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    bank = builtin.slice();
    renderAdmin();
    renderStats();
    renderLevelFilters();
    message('已恢复内置词库', 'ok');
  }

  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  });

  searchInput.addEventListener('input', function () {
    $('search-clear').hidden = searchInput.value === '';
    renderSuggestions();
    runSearch();
  });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      suggestionsEl.hidden = true;
      runSearch();
    }
    if (e.key === 'Escape') { suggestionsEl.hidden = true; }
  });
  $('search-clear').addEventListener('click', function () {
    searchInput.value = '';
    $('search-clear').hidden = true;
    suggestionsEl.hidden = true;
    renderSearchEmpty();
  });

  suggestionsEl.addEventListener('click', function (e) {
    var li = e.target.closest('li');
    if (!li) return;
    searchInput.value = li.getAttribute('data-word');
    suggestionsEl.hidden = true;
    $('search-clear').hidden = false;
    runSearch();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.searchbox')) suggestionsEl.hidden = true;
  });

  $('search-chips').addEventListener('click', function (e) {
    var chip = e.target.closest('[data-sample]');
    if (!chip) return;
    searchInput.value = chip.getAttribute('data-sample');
    $('search-clear').hidden = false;
    runSearch();
  });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('.word-en[data-word]');
    if (!el || !el.closest('.group.compact')) return;
    searchInput.value = el.getAttribute('data-word');
    $('search-clear').hidden = false;
    switchTab('search');
    runSearch();
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('#level-filter-search .seg-btn, #level-filter-browse .seg-btn');
    if (!btn) return;
    levelFilter = btn.getAttribute('data-level');
    renderLevelFilters();
    renderSuggestions();
    runSearch();
    renderBrowse();
  });

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('#browse-mode .seg-btn');
    if (!btn) return;
    browseMode = btn.getAttribute('data-mode');
    document.querySelectorAll('#browse-mode .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
    renderBrowse();
  });

  $('btn-add').addEventListener('click', function () {
    $('admin-import').hidden = true;
    openForm(null);
    $('f-words').focus();
  });
  $('btn-cancel').addEventListener('click', closeForm);
  $('btn-save').addEventListener('click', saveForm);
  $('btn-export').addEventListener('click', exportBank);
  $('btn-import').addEventListener('click', function () {
    closeForm();
    $('admin-import').hidden = !$('admin-import').hidden;
  });
  $('btn-import-confirm').addEventListener('click', function () {
    doImport($('import-text').value);
  });
  $('btn-import-cancel').addEventListener('click', function () {
    $('admin-import').hidden = true;
  });
  $('btn-reset').addEventListener('click', resetBank);
  $('import-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { doImport(String(reader.result)); };
    reader.readAsText(file, 'utf-8');
    this.value = '';
  });

  adminList.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var id = btn.closest('.admin-row').getAttribute('data-id');
    if (btn.getAttribute('data-act') === 'edit') {
      var g = bank.filter(function (x) { return x.id === id; })[0];
      if (g) { $('admin-import').hidden = true; openForm(g); }
    } else if (btn.getAttribute('data-act') === 'del') {
      if (!window.confirm('删除词条 ' + id + '？')) return;
      bank = bank.filter(function (x) { return x.id !== id; });
      saveBank();
      renderAdmin();
      renderStats();
      message('已删除', 'ok');
    }
  });

  renderLevelFilters();
  renderStats();
  renderSearchEmpty();
  renderBrowse();
})();
</script>
</body>
</html>
