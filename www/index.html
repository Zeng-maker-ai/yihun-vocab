<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>LEXI｜易混词辨析</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<style>
/* ============================================================
   LEXI v2.1 ·「纸墨词典」Ink & Paper
   编辑风学习工具：暖纸底 / 墨色字 / 朱砂红强调 / 衬线词头
   ============================================================ */
:root {
  --paper: #f5efe3;          /* 页面底：暖米纸 */
  --paper-2: #efe7d7;        /* 次级纸 */
  --surface: #fffdf6;        /* 卡片：近白纸 */
  --ink: #23201a;            /* 正文墨色 */
  --ink-soft: #5f574b;       /* 弱文字 */
  --ink-faint: #9a8f7e;      /* 更弱 */
  --line: rgba(35, 32, 26, .16);   /* 发丝描边 */
  --line-strong: rgba(35, 32, 26, .34);
  --cinnabar: #b5382a;       /* 朱砂红：主强调 */
  --cinnabar-deep: #8f2c20;
  --cinnabar-wash: #f4e3dc;  /* 朱砂淡洗 */
  --indigo: #2d4a63;         /* 藏蓝：标签/音标 */
  --indigo-wash: #e3e9ee;
  --gold: #b98a2e;           /* 描金：高亮 */
  --gold-wash: #f5e9c8;
  --ok: #3d6b35;
  --ok-wash: #e7ecdf;
  --danger: #a02c22;
  --serif: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
  --sans: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  --radius: 6px;
  --radius-s: 4px;
  --shadow: 0 1px 0 rgba(35,32,26,.05), 0 6px 18px -8px rgba(35,32,26,.18);
  --nav-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
/* 纸张肌理：极淡的横向纹 */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: repeating-linear-gradient(0deg, rgba(35,32,26,.012) 0 2px, transparent 2px 6px);
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }
main { position: relative; z-index: 1; }

/* ── 顶栏：墨色书脊 ── */
.appbar { background: var(--ink); color: var(--surface); padding: 16px 0 14px; border-bottom: 3px double var(--gold); }
.appbar .wrap { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 38px; height: 38px; border: 1px solid rgba(245,239,227,.55); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 20px; font-weight: 700; color: var(--gold);
}
.brand-name { font-family: var(--serif); font-size: 23px; letter-spacing: 3px; font-weight: 700; }
.brand-name em { font-style: normal; color: var(--gold); }
.brand-sub { font-size: 11.5px; opacity: .78; margin-top: 2px; letter-spacing: 1px; }
.appbar-stats { font-size: 11.5px; opacity: .85; text-align: right; line-height: 1.5; }
.appbar-stats b { font-family: var(--serif); font-size: 14px; color: var(--gold); }

/* ── 底部导航：纸标签 ── */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bottomnav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  color: var(--ink-faint); font-size: 10.5px; font-weight: 600; letter-spacing: 1px;
  position: relative;
}
.bottomnav button svg { width: 20px; height: 20px; margin-bottom: 1px; }
.bottomnav button.active { color: var(--cinnabar); }
.bottomnav button.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 34px; height: 3px; background: var(--cinnabar); border-radius: 0 0 3px 3px;
}
main { padding-bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0)); }

/* ── 页面 ── */
.page { display: none; padding-top: 16px; }
.page.active { display: block; }
.page-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.page-head h2 { font-family: var(--serif); font-size: 19px; letter-spacing: 1px; }
.rule-title { display: flex; align-items: center; gap: 10px; }
.rule-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* ── 卡片：纸页 ── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; letter-spacing: .5px; }

/* ── 首页对比入口：卷首语 ── */
.hero { margin-top: 14px; }
.hero-box { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border: 1px solid var(--line); position: relative; overflow: hidden; }
.hero-box::before {
  content: '辨'; position: absolute; right: -6px; top: -18px;
  font-family: var(--serif); font-size: 110px; color: rgba(35,32,26,.05); pointer-events: none;
}
.hero-title { font-family: var(--serif); font-size: 17.5px; font-weight: 700; margin-bottom: 2px; letter-spacing: 1px; }
.hero-sub { color: var(--ink-soft); font-size: 12.5px; margin-bottom: 12px; }
.compare-inputs { display: flex; align-items: center; gap: 8px; }
.compare-inputs input {
  flex: 1; min-width: 0; border: 1px solid var(--line-strong); border-radius: var(--radius-s);
  padding: 10px 12px; font-size: 16px; background: var(--paper);
  font-family: var(--serif); letter-spacing: .5px;
}
.compare-inputs input:focus { outline: none; border-color: var(--cinnabar); background: var(--surface); }
.swap-btn { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; font-weight: 800; background: var(--paper); }
.swap-btn:active { color: var(--cinnabar); border-color: var(--cinnabar); }

/* ── 按钮 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--cinnabar); color: #fff; border-radius: var(--radius-s);
  padding: 10px 16px; font-weight: 700; font-size: 14.5px; letter-spacing: 2px;
  transition: transform .06s;
  border: 1px solid var(--cinnabar-deep);
}
.btn:active { transform: scale(.97); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--cinnabar); border: 1px solid var(--cinnabar); }
.btn.small { padding: 5px 11px; font-size: 12.5px; letter-spacing: 1px; }
.btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }

/* ── 搜索 ── */
.search-box { position: relative; margin-top: 16px; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 0 12px; }
.search-wrap:focus-within { border-color: var(--cinnabar); }
.search-wrap input { flex: 1; border: 0; outline: none; background: none; padding: 11px 0; font-size: 15.5px; }
.search-wrap svg { flex: 0 0 auto; color: var(--ink-faint); }
.suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-s); box-shadow: var(--shadow); list-style: none; margin: 0; padding: 4px 0; z-index: 30; max-height: 300px; overflow: auto; }
.suggestions li { display: flex; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; }
.suggestions li:active { background: var(--cinnabar-wash); }
.sug-word { font-family: var(--serif); font-weight: 700; }
.sug-ipa { color: var(--indigo); font-size: 12.5px; }
.sug-mean { color: var(--ink-soft); font-size: 12.5px; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hotwords { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.hotwords button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; font-size: 13px; color: var(--ink-soft); font-family: var(--serif); }
.hotwords button:active { border-color: var(--cinnabar); color: var(--cinnabar); }
.result-head { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 12px; margin: 14px 0 8px; letter-spacing: .5px; }

/* ── 筛选 chips ── */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; }
.chip.active { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* ── 词条卡片：词典词条 ── */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 12px; overflow: hidden; }
.group-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0; }
.group-words { flex: 1; font-family: var(--serif); font-size: 17px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .5px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 10.5px; font-weight: 700; border-radius: 2px; padding: 2px 6px; white-space: nowrap; letter-spacing: 1px; }
.b-level { background: var(--indigo-wash); color: var(--indigo); border: 1px solid rgba(45,74,99,.25); }
.b-type { background: var(--cinnabar-wash); color: var(--cinnabar-deep); border: 1px solid rgba(181,56,42,.25); }
.fav-btn { flex: 0 0 auto; font-size: 18px; color: var(--ink-faint); padding: 2px 4px; }
.fav-btn.on { color: var(--cinnabar); }
.group-body { padding: 10px 14px 14px; }
.word-cols { display: flex; gap: 8px; }
.word-col { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; position: relative; }
.word-en { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-right: 30px; }
.word-ipa { display: block; color: var(--indigo); font-size: 12.5px; margin-top: 2px; }
.word-pos { display: inline-block; font-size: 10.5px; color: var(--ink-soft); background: var(--paper-2); border-radius: 2px; padding: 1px 5px; margin-top: 6px; margin-right: 4px; }
.word-mean { display: block; color: var(--ink-soft); font-size: 13.5px; margin-top: 4px; }
.play-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--cinnabar-wash); color: var(--cinnabar); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(181,56,42,.3); }
.play-btn svg { width: 14px; height: 14px; }
.play-btn:active { transform: scale(.92); }
.diff-controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.note { background: var(--indigo-wash); border-left: 3px solid var(--indigo); border-radius: 2px; padding: 9px 11px; font-size: 13px; margin-top: 10px; color: var(--ink); }
.note b { font-weight: 800; color: var(--indigo); }
.examples { margin-top: 10px; border-top: 1px dashed var(--line-strong); padding-top: 8px; }
.example-row { font-size: 13.5px; color: var(--ink); margin-bottom: 6px; }
.example-row .ex-word { font-family: var(--serif); font-weight: 800; color: var(--cinnabar-deep); }
.example-row .ex-col { color: var(--ink-faint); font-size: 12px; margin-left: 6px; }
.src-badge { font-size: 10px; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 2px; padding: 1px 5px; margin-left: 8px; letter-spacing: 1px; }
.more-btn { width: 100%; text-align: center; color: var(--cinnabar); font-weight: 600; font-size: 12.5px; padding: 9px 0 0; letter-spacing: 1px; }
mark, .diff-mark { background: var(--gold-wash); color: var(--cinnabar-deep); border-radius: 2px; padding: 0 2px; font-weight: 800; }
.browse-head { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; color: var(--ink-faint); font-size: 12.5px; }
.browse-head .bh-title { font-family: var(--serif); font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: 1px; }
.browse-head .bh-title::after { content: ''; display: block; width: 26px; height: 2px; background: var(--cinnabar); margin-top: 2px; }
.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--ink-soft); text-align: center; padding: 26px 16px; font-size: 13.5px; }

/* ── 对比页 ── */
.overlay-view { position: fixed; inset: 0; background: var(--paper); z-index: 60; display: none; overflow-y: auto; padding-bottom: 30px; }
.overlay-view.open { display: block; }
.overlay-bar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.overlay-bar .wrap { display: flex; align-items: center; gap: 10px; height: 50px; }
.back-btn { font-size: 22px; color: var(--cinnabar); width: 30px; }
.overlay-bar h2 { font-family: var(--serif); font-size: 17px; flex: 1; letter-spacing: 1px; }
.cp-word-box { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); padding: 12px; margin-bottom: 10px; }
.cp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cp-word { font-family: var(--serif); font-size: 21px; font-weight: 800; }
.cp-ipa { color: var(--indigo); font-size: 13px; }
.cp-mean { color: var(--ink-soft); font-size: 13.5px; }
.cp-col { flex: 1; min-width: 0; }
.diff-row { display: flex; gap: 8px; margin-top: 6px; }
.diff-cell { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; text-align: center; font-family: var(--serif); font-size: 20px; font-weight: 800; letter-spacing: 1px; word-break: break-all; }
.diff-cell .lbl { display: block; font-size: 10.5px; color: var(--ink-faint); font-weight: 400; letter-spacing: 2px; margin-top: 4px; }
.sum-line { background: var(--cinnabar-wash); border-left: 3px solid var(--cinnabar); color: var(--ink); border-radius: 2px; padding: 9px 12px; font-size: 13px; margin-top: 10px; }
.audio-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.audio-note { font-size: 12px; color: var(--ink-faint); }
.loading { color: var(--ink-soft); font-size: 13px; padding: 8px 0; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--cinnabar); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.def-item { margin-bottom: 8px; font-size: 13.5px; }
.def-item .dp { color: var(--indigo); font-weight: 700; margin-right: 6px; }
.def-item .dd { color: var(--ink); }
.def-item .de { color: var(--ink-soft); font-size: 12.5px; display: block; margin-top: 2px; }

/* ── 训练 ── */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; text-align: left; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.mode-card:active { border-color: var(--cinnabar); }
.mode-card .mi { width: 26px; height: 26px; color: var(--cinnabar); }
.mode-card .mi svg { width: 100%; height: 100%; }
.mode-card .mt { font-family: var(--serif); font-weight: 800; font-size: 15px; margin-top: 8px; letter-spacing: 1px; }
.mode-card .md { color: var(--ink-soft); font-size: 11.5px; margin-top: 2px; }
.review-banner { background: var(--ink); color: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-left: 4px solid var(--gold); }
.review-banner .rt { font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: 1px; }
.review-banner .rs { font-size: 11.5px; opacity: .8; margin-top: 2px; }
.review-banner .btn { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.quiz-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 12.5px; color: var(--ink-soft); }
.progress-track { height: 4px; background: var(--paper-2); border-radius: 999px; overflow: hidden; flex: 1; margin-right: 10px; border: 1px solid var(--line); }
.progress-fill { height: 100%; background: var(--cinnabar); transition: width .2s; }
.quiz-prompt { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--cinnabar); border-radius: var(--radius); padding: 18px 14px; text-align: center; margin-bottom: 12px; }
.quiz-prompt .qp-label { font-size: 11px; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: 2px; }
.quiz-prompt .qp-main { font-family: var(--serif); font-size: 21px; font-weight: 800; }
.quiz-prompt .qp-sub { color: var(--ink-soft); font-size: 13px; margin-top: 6px; }
.quiz-prompt .qp-sentence { font-size: 16.5px; line-height: 1.8; }
.quiz-prompt .qp-blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--cinnabar); color: var(--cinnabar); font-family: var(--serif); font-weight: 800; text-align: center; }
.opt-list { display: grid; gap: 8px; }
.opt-btn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 13px 14px; font-size: 16px; font-weight: 600; text-align: left; display: flex; align-items: center; gap: 10px; font-family: var(--serif); letter-spacing: .5px; }
.opt-btn:active { border-color: var(--cinnabar); }
.opt-btn.correct { border-color: var(--ok); background: var(--ok-wash); }
.opt-btn.wrong { border-color: var(--danger); background: var(--cinnabar-wash); }
.opt-btn .opt-key { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--ink-soft); font-size: 11px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); }
.feedback { border-radius: var(--radius); padding: 12px 14px; margin-top: 12px; font-size: 13.5px; border: 1px solid; }
.feedback.good { background: var(--ok-wash); color: var(--ok); border-color: rgba(61,107,53,.3); }
.feedback.bad { background: var(--cinnabar-wash); color: var(--danger); border-color: rgba(160,44,34,.3); }
.feedback .fb-title { font-weight: 800; margin-bottom: 4px; letter-spacing: 1px; }
.feedback .fb-body { color: var(--ink); }
.timer { font-family: var(--serif); font-weight: 800; color: var(--cinnabar); font-size: 15px; }
.result-card { text-align: center; padding: 26px 16px; }
.result-score { font-family: var(--serif); font-size: 44px; font-weight: 800; color: var(--cinnabar); }
.result-sub { color: var(--ink-soft); font-size: 13px; margin: 6px 0 16px; }

/* ── 我的 ── */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat-cell { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px 6px; text-align: center; }
.stat-cell .sv { font-family: var(--serif); font-size: 19px; font-weight: 800; color: var(--cinnabar); }
.stat-cell .sl { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
.mastery-bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin: 8px 0 4px; background: var(--paper-2); border: 1px solid var(--line); }
.mastery-bar span { height: 100%; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--ink-soft); flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.set-row:last-child { border-bottom: 0; }
.set-row .sl-label { font-weight: 600; }
.seg { display: flex; background: var(--paper-2); border-radius: 6px; padding: 3px; border: 1px solid var(--line); }
.seg button { padding: 5px 14px; border-radius: 4px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.seg button.active { background: var(--ink); color: var(--surface); }
.toggle { width: 44px; height: 25px; border-radius: 999px; background: var(--paper-2); position: relative; transition: background .15s; border: 1px solid var(--line-strong); }
.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on { background: var(--cinnabar); }
.toggle.on::after { left: 21px; }
.range { width: 130px; accent-color: var(--cinnabar); }
.err-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.err-row:last-child { border-bottom: 0; }

/* ── 词库维护 ── */
.admin-row { border-top: 1px solid var(--line); padding: 10px 0; }

.admin-id { font-size: 11.5px; color: var(--ink-faint); font-family: Georgia, serif; }
.admin-actions { display: flex; gap: 8px; margin-top: 8px; }
.form-grid { display: grid; gap: 10px; }
.form-grid label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; display: block; margin-bottom: 4px; }
.form-grid input, .form-grid select, .form-grid textarea {

}
.form-grid textarea { min-height: 84px; resize: vertical; font-family: var(--serif); }
.form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus { outline: none; border-color: var(--cinnabar); background: var(--surface); }

/* ── 弹层 ── */
.modal-mask { position: fixed; inset: 0; background: rgba(24, 22, 17, .5); z-index: 70; display: none; align-items: flex-end; justify-content: center; }

@media (min-width: 500px) { .modal-mask.open { align-items: center; } .modal { border-radius: 14px; } }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: var(--radius-s); border: 1px solid var(--gold); padding: 9px 18px; font-size: 13px; z-index: 90; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86vw; text-align: center; }
.toast.show { opacity: 1; }
@media (max-width: 420px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

"advice 是名词（不可数），advise 是动词，c 与 s 发音不同。"},{"id":"g088","level":"初中","source":"人教/译林","words":[{"word":"accept","pos":"v.","meaning":"接受","ipa":"/əkˈsept/"},{"word":"except","pos":"prep.","meaning":"除…之外","ipa":"/ɪkˈsept/"},{"word":"expect","pos":"v.","meaning":"期望","ipa":"/ɪkˈspekt/"}],"note":"accept 表“接受”，except 表“除…之外”，expect 表“期望”。"},{"id":"g089","level":"初中","source":"人教/译林","words":[{"word":"borrow","pos":"v.","meaning":"借入","ipa":"/ˈbɒrəʊ/"},{"word":"lend","pos":"v.","meaning":"借出","ipa":"/lend/"}],"note":"borrow 是“向别人借”，lend 是“借给别人”。"},{"id":"g090","level":"初中","source":"人教/译林","words":[{"word":"bring","pos":"v.","meaning":"带来","ipa":"/brɪŋ/"},{"word":"take","pos":"v.","meaning":"带走","ipa":"/teɪk/"},{"word":"carry","pos":"v.","meaning":"携带；搬运","ipa":"/ˈkæri/"},{"word":"fetch","pos":"v.","meaning":"去取来","ipa":"/fetʃ/"}],"note":"bring 朝说话人方向带，take 朝远离方向带，carry 表随身携带，fetch 表去取回。"},{"id":"g091","level":"初中","source":"人教/译林","words":[{"word":"spend","pos":"v.","meaning":"花费（人作主语）","ipa":"/spend/"},{"word":"cost","pos":"v.","meaning":"花费（物作主语）","ipa":"/kɒst/"},{"word":"take","pos":"v.","meaning":"花费（it 作主语）","ipa":"/teɪk/"},{"word":"pay","pos":"v.","meaning":"支付","ipa":"/peɪ/"}],"note":"spend 人作主语，cost 物作主语，take 常用 it takes 句型，pay 表付款。"},{"id":"g092","level":"初中","source":"人教/译林","words":[{"word":"lie","pos":"v.","meaning":"躺；说谎","ipa":"/laɪ/"},{"word":"lay","pos":"v.","meaning":"放置；下蛋","ipa":"/leɪ/"}],"note":"lie（躺）的过去式是 lay，lay（放置）的过去式是 laid。"},{"id":"g093","level":"初中","source":"人教/译林","words":[{"word":"receive","pos":"v.","meaning":"收到","ipa":"/rɪˈsiːv/"},{"word":"accept","pos":"v.","meaning":"接受","ipa":"/əkˈsept/"}],"note":"receive 只表示“收到”，accept 表示“接受/同意收下”。"},{"id":"g094","level":"初中","source":"人教/译林","words":[{"word":"win","pos":"v.","meaning":"赢（比赛）","ipa":"/wɪn/"},{"word":"beat","pos":"v.","meaning":"打败（对手）","ipa":"/biːt/"}],"note":"win 后接比赛/奖品，beat 后接人或队伍。"},{"id":"g095","level":"初中","source":"人教/译林","words":[{"word":"say","pos":"v.","meaning":"说（内容）","ipa":"/seɪ/"},{"word":"speak","pos":"v.","meaning":"说（语言）；发言","ipa":"/spiːk/"},{"word":"talk","pos":"v.","meaning":"交谈","ipa":"/tɔːk/"},{"word":"tell","pos":"v.","meaning":"告诉","ipa":"/tel/"}],"note":"say 强调说的内容，speak 强调说语言/发言，talk 强调交谈，tell 强调告诉某人。"},{"id":"g096","level":"初中","source":"人教/译林","words":[{"word":"arrive","pos":"v.","meaning":"到达","ipa":"/əˈraɪv/"},{"word":"reach","pos":"v.","meaning":"到达","ipa":"/riːtʃ/"},{"word":"get to","pos":"phr.","meaning":"到达","ipa":"/ɡet tuː/"}],"note":"arrive 接 in/at，reach 直接接地点，get to 用于口语。"},{"id":"g097","level":"初中","source":"人教/译林","words":[{"word":"join","pos":"v.","meaning":"加入（组织）","ipa":"/dʒɔɪn/"},{"word":"attend","pos":"v.","meaning":"出席","ipa":"/əˈtend/"},{"word":"take part in","pos":"phr.","meaning":"参加（活动）","ipa":"/teɪk pɑːt ɪn/"}],"note":"join 表加入组织/人群，attend 表出席，take part in 表参加活动。"},{"id":"g098","level":"初中","source":"人教/译林","words":[{"word":"hope","pos":"v./n.","meaning":"希望","ipa":"/həʊp/"},{"word":"wish","pos":"v./n.","meaning":"希望；祝愿","ipa":"/wɪʃ/"}],"note":"hope 表可实现愿望，wish 可表难以实现或虚拟的愿望，也可表祝愿。"},{"id":"g099","level":"初中","source":"人教/译林","words":[{"word":"find","pos":"v.","meaning":"找到","ipa":"/faɪnd/"},{"word":"look for","pos":"phr.","meaning":"寻找","ipa":"/lʊk fɔː(r)/"}],"note":"look for 强调寻找的过程，find 强调找到的结果。"},{"id":"g100","level":"初中","source":"人教/译林","words":[{"word":"real","pos":"adj.","meaning":"真实的（非假）","ipa":"/ˈrɪəl/"},{"word":"true","pos":"adj.","meaning":"真实的（符合事实）","ipa":"/truː/"}],"note":"real 强调“非虚构/非仿造”，true 强调“与事实相符”。"},{"id":"g101","level":"初中","source":"人教/译林","words":[{"word":"dead","pos":"adj.","meaning":"死的","ipa":"/ded/"},{"word":"death","pos":"n.","meaning":"死亡","ipa":"/deθ/"},{"word":"die","pos":"v.","meaning":"死","ipa":"/daɪ/"},{"word":"dying","pos":"adj.","meaning":"垂死的","ipa":"/ˈdaɪɪŋ/"}],"note":"dead 形容词，death 名词，die 动词，dying 是 die 的现在分词。"},{"id":"g102","level":"初中","source":"人教/译林","words":[{"word":"ill","pos":"adj.","meaning":"生病的","ipa":"/ɪl/"},{"word":"sick","pos":"adj.","meani "g463","level":"初中","source":"其他教材","words":[{"word":"edge","pos":"n.","meaning":"边缘","ipa":"/edʒ/"},{"word":"hedge","pos":"n.","meaning":"树篱","ipa":"/hedʒ/"}],"note":"edge 边缘、hedge 树篱只差开头 e/h；on the edge of 在……的边缘；hedge 常见于英国花园。"},{"id":"g464","level":"初中","source":"其他教材","words":[{"word":"fail","pos":"v.","meaning":"失败；不及格","ipa":"/feɪl/"},{"word":"fell","pos":"v.","meaning":"砍倒（fall 的过去式）","ipa":"/fel/"},{"word":"feel","pos":"v.","meaning":"感觉","ipa":"/fiːl/"},{"word":"fool","pos":"n./v.","meaning":"傻瓜；愚弄","ipa":"/fuːl/"}],"note":"四胞胎：fail 失败（ai）、fell 砍倒（fall 的过去式）、feel 感觉（ee）、fool 傻瓜（oo），元音一换全变。"},{"id":"g465","level":"初中","source":"其他教材","words":[{"word":"farther","pos":"adv./adj.","meaning":"更远（实际距离）","ipa":"/ˈfɑːðə(r)/"},{"word":"further","pos":"adv./adj.","meaning":"进一步（抽象程度）","ipa":"/ˈfɜːðə(r)/"}],"note":"farther 指实际距离更远，further 指抽象程度更进一步（further study 深造）；口语常通用，书面要分。"},{"id":"g466","level":"初中","source":"其他教材","words":[{"word":"fever","pos":"n.","meaning":"发烧","ipa":"/ˈfiːvə(r)/"},{"word":"favor","pos":"n./v.","meaning":"恩惠；支持","ipa":"/ˈfeɪvə(r)/"}],"note":"fever 发烧、favor 恩惠只差开头 f/v；have a fever 发烧，do sb a favor 帮个忙。"},{"id":"g467","level":"初中","source":"其他教材","words":[{"word":"flame","pos":"n.","meaning":"火焰","ipa":"/fleɪm/"},{"word":"frame","pos":"n.","meaning":"框架","ipa":"/freɪm/"}],"note":"flame 火焰、frame 框架只差 l/r；photo frame 相框；flame 复数 flames 常形容火苗。"},{"id":"g468","level":"初中","source":"其他教材","words":[{"word":"forty","pos":"num.","meaning":"四十","ipa":"/ˈfɔːti/"},{"word":"foreign","pos":"adj.","meaning":"外国的","ipa":"/ˈfɒrən/"}],"note":"forty 四十没有 u（four 才有 u），foreign 外国的 ei 读 /ə/；两者都以 fo- 开头，注意后半不同。"},{"id":"g469","level":"初中","source":"其他教材","words":[{"word":"glad","pos":"adj.","meaning":"高兴的","ipa":"/ɡlæd/"},{"word":"glass","pos":"n.","meaning":"玻璃；眼镜","ipa":"/ɡlɑːs/"},{"word":"globe","pos":"n.","meaning":"地球仪；球体","ipa":"/ɡləʊb/"}],"note":"glad 高兴的、glass 玻璃只差结尾 d/ss；globe 地球仪多一个 e；glasses 眼镜是复数形式。"},{"id":"g470","level":"初中","source":"其他教材","words":[{"word":"heal","pos":"v.","meaning":"治愈","ipa":"/hiːl/"},{"word":"heel","pos":"n.","meaning":"脚后跟；鞋跟","ipa":"/hiːl/"}],"note":"同音词：heal /hiːl/ 治愈、heel /hiːl/ 脚后跟。heal the wound 治愈伤口，high heels 高跟鞋。"},{"id":"g471","level":"初中","source":"其他教材","words":[{"word":"host","pos":"n./v.","meaning":"主人；主持","ipa":"/həʊst/"},{"word":"ghost","pos":"n.","meaning":"鬼；幽灵","ipa":"/ɡəʊst/"}],"note":"host 主人、ghost 鬼只差一个 g；host a show 主持节目；ghost story 鬼故事。"},{"id":"g472","level":"初中","source":"其他教材","words":[{"word":"lamb","pos":"n.","meaning":"羊羔","ipa":"/læm/"},{"word":"lamp","pos":"n.","meaning":"台灯","ipa":"/læmp/"},{"word":"lame","pos":"adj.","meaning":"跛的","ipa":"/leɪm/"}],"note":"lamb 羊羔的 b 不发音，读 /læm/；lamp 台灯读 /læmp/；lame 跛的。lamb 与 lamp 只差 p。"},{"id":"g473","level":"初中","source":"其他教材","words":[{"word":"law","pos":"n.","meaning":"法律","ipa":"/lɔː/"},{"word":"lawn","pos":"n.","meaning":"草坪","ipa":"/lɔːn/"},{"word":"claw","pos":"n.","meaning":"爪子","ipa":"/klɔː/"}],"note":"law 法律、lawn 草坪多一个 n；claw 爪子以 c- 开头。law 的 aw 读 /ɔː/，三者同韵。"},{"id":"g474","level":"初中","source":"其他教材","words":[{"word":"lead","pos":"v./n.","meaning":"带领；领先","ipa":"/liːd/"},{"word":"leaf","pos":"n.","meaning":"叶子","ipa":"/liːf/"},{"word":"leak","pos":"v./n.","meaning":"泄漏","ipa":"/liːk/"}],"note":"lead 带领（ea 读 /iːd/）、leaf 叶子（f）、leak 泄漏（k）；lead to 导致，a leak in the pipe 管子漏了。"},{"id":"g475","level":"初中","source":"其他教材","words":[{"word":"lesson","pos":"n.","meaning":"课；教训","ipa":"/ˈlesn/"},{"word":"lessen","pos":"v.","meaning":"减少","ipa":"/ˈlesn/"}],"note":"lesson 名词“课/教训”，lessen 动词“减少”，读音完全相同 /ˈlesn/；teach sb a lesson 给某人一个教训。"},{"id":"g476","level":"初中","source":"其他教材","words":[{"word":"living","pos":"adj./n.","meaning":"活着的；生计","ipa":"/ˈlɪvɪŋ/"},{"word":"lively","pos":"adj.","meaning":"活泼的","ipa":"/ˈlaɪvli/"},{"word":"alive","pos":"adj.","meaning":"活着的（作表语）","ipa":"/əˈlaɪv/"}],"note":"living 作定语（living things 生物）；lively 活泼的（不是“活的”！）；alive 只作表语（He is alive）。"},{"id":"g477","level":"初中","source":"其他教材","words":[{"word":"mine","pos":"pron./n.","meaning":"我的（东西）；矿","ipa":"/maɪn/"},{"word":"mind","pos":"n./v.","meaning":"头脑；介意","ipa":"/maɪnd/"}],"note":"mine 我的东西（名词性物主代词）、mind 头脑/介意只差 n/m；Never mind 没关系；make up one's mind 下决心。"},{"id":"g478","level":"初中","source":"其他教材","words":[{"word":"morning","pos":"n.","meaning":"早晨","ipa":"/ˈmɔːnɪŋ/"},{"word":"mourning","pos":"n.","meaning":"哀悼","ipa":"/ˈmɔːnɪŋ/"}],"note":"morning 早晨、mourning 哀悼读音完全相同 /ˈmɔːnɪŋ/；in the morning 早晨，in mourning 戴孝/哀悼。"},{"id":"g479","level":"初中","source":"其他教材","words":[{"word":"needle","pos":"n.","meaning":"针","ipa":"/ˈniːdl/"},{"word":"noodle","pos":"n.","meaning":"面条","ipa":"/ˈnuːdl/"}],"note":"needle 针、noodle 面条只差 d/dl；two noodles 两根面条；needle work 缝纫活（写作 needlework）。"},{"id":"g480","level":"初中","source":"其他教材","words":[{"word":"odd","pos":"adj.","meaning":"奇怪的；奇数的","ipa":"/ɒd/"},{"word":"add","pos":"v.","meaning":"添加","ipa":"/æd/"}],"note":"odd 奇怪的/奇数的、add 添加只差 d 的个数；odd number 奇数，add up 把……加起来。"},{"id":"g481","level":"初中","source":"其他教材","words":[{"word":"rival","pos":"n.","meaning":"对手","ipa":"/ˈraɪvl/"},{"word":"river","pos":"n.","meaning":"河流","ipa":"/ˈrɪvə(r)/"}],"note":"rival 对手、river 河流只差 v/l；读音分别为 /ˈraɪvl/ 与 /ˈrɪvə(r)/，注意 i 的发音不同。"},{"id":"g482","level":"初中","source":"其他教材","words":[{"word":"role","pos":"n.","meaning":"角色","ipa":"/rəʊl/"},{"word":"roll","pos":"v./n.","meaning":"滚动；卷","ipa":"/rəʊl/"}],"note":"同音词：role /rəʊl/ 角色、roll /rəʊl/ 滚动。play a role in 在……中起作用，roll over 翻滚。"},{"id":"g483","level":"初中","source":"其他教材","words":[{"word":"scent","pos":"n.","meaning":"气味","ipa":"/sent/"},{"word":"cent","pos":"n.","meaning":"分（货币）","ipa":"/sent/"},{"word":"sent","pos":"v.","meaning":"寄送（send 的过去式）","ipa":"/sent/"}],"note":"三词同音 /sent/：scent 气味（s 不发音）、cent 分币、sent 寄出。靠拼写和上下文区分。"},{"id":"g484","level":"初中","source":"其他教材","words":[{"word":"sell","pos":"v.","meaning":"卖","ipa":"/sel/"},{"word":"shell","pos":"n.","meaning":"贝壳；壳","ipa":"/ʃel/"},{"word":"shelf","pos":"n.","meaning":"架子","ipa":"/ʃelf/"}],"note":"sell 卖、shell 贝壳只差 h；shelf 架子多一个 f；复数 shells、shelves（f 变 ves）。"},{"id":"g485","level":"初中","source":"其他教材","words":[{"word":"which","pos":"pron.","meaning":"哪一个","ipa":"/wɪtʃ/"},{"word":"witch","pos":"n.","meaning":"女巫","ipa":"/wɪtʃ/"}],"note":"同音异形：which 哪一个、witch 女巫都读 /wɪtʃ/。which 是疑问词，witch 是万圣节的巫婆。"},{"id":"g486","level":"初中","source":"其他教材","words":[{"word":"while","pos":"conj./n.","meaning":"当……时；一会儿","ipa":"/waɪl/"},{"word":"whale","pos":"n.","meaning":"鲸鱼","ipa":"/weɪl/"}],"note":"while 一会儿、whale 鲸鱼只差 e/a；wh 读 /w/；in a while 过一会儿，a blue whale 一头蓝鲸。"},{"id":"g487","level":"初中","source":"其他教材","words":[{"word":"wire","pos":"n.","meaning":"金属丝；电线","ipa":"/ˈwaɪə(r)/"},{"word":"fire","pos":"n./v.","meaning":"火；解雇","ipa":"/ˈfaɪə(r)/"},{"word":"hire","pos":"v.","meaning":"雇用","ipa":"/ˈhaɪə(r)/"}],"note":"-ire 三兄弟：wire 电线、fire 火/解雇、hire 雇用，只差首字母；on fire 着火，hire a car 租车。"},{"id":"g488","level":"初中","source":"其他教材","words":[{"word":"dust","pos":"n.","meaning":"灰尘","ipa":"/dʌst/"},{"word":"just","pos":"adv.","meaning":"刚刚；只是","ipa":"/dʒʌst/"},{"word":"must","pos":"v.","meaning":"必须","ipa":"/mʌst/"},{"word":"gust","pos":"n.","meaning":"一阵狂风","ipa":"/ɡʌst/"}],"note":"-ust 四兄弟：dust 灰尘、just 刚刚、must 必须、gust 阵风，只差首字母。"},{"id":"g489","level":"初中","source":"其他教材","words":[{"word":"sweep","pos":"v.","meaning":"打扫；掠过","ipa":"/swiːp/"},{"word":"sleep","pos":"v./n.","meaning":"睡觉","ipa":"/sliːp/"}],"note":"sweep 打扫、sleep 睡觉只差 w/e；sweep the floor 扫地；swept 是 sweep 的过去式。"},{"id":"g490","level":"初中","source":"其他教材","words":[{"word":"tank","pos":"n.","meaning":"坦克；水箱","ipa":"/tæŋk/"},{"word":"bank","pos":"n.","meaning":"银行；河岸","ipa":"/bæŋk/"}],"note":"tank 坦克、bank 银行只差 t/b；bank of the river 河岸；tanker 油轮由此而来。"},{"id":"g561","level":"高中","source":"其他教材","words":[{"word":"abundant","pos":"adj.","meaning":"丰富的","ipa":"/əˈbʌndənt/"},{"word":"abandon","pos":"v.","meaning":"放弃；抛弃","ipa":"/əˈbændən/"}],"note":"拼写只差 nt/don 结尾：abundant 是形容词“丰富的”，abandon 是动词“抛弃”。abundant in 富产……；abandon doing 放弃做某事。"},{"id":"g562","level":"高中","source":"其他教材","words":[{"word":"account","pos":"n./v.","meaning":"账户；描述；解释","ipa":"/əˈkaʊnt/"},{"word":"count","pos":"v./n.","meaning":"数；计数","ipa":"/kaʊnt/"}],"note":"account 多了 ac-：an account 账户；count 数数。account for 解释/占（比例），是高频考点短语。"},{"id":"g563","level":"高中","source":"其他教材","words":[{"word":"amount","pos":"n.","meaning":"数量（不可数）","ipa":"/əˈmaʊnt/"},{"word":"mount","pos":"v./n.","meaning":"上升；山","ipa":"/maʊnt/"}],"note":"amount 数量多一个 a：an amount of money；mount 用于 Mount Tai 泰山；网络热词连 mount 都常与 amount 混写。"},{"id":"g564","level":"高中","source":"其他教材","words":[{"word":"appeal","pos":"v./n.","meaning":"呼吁；吸引","ipa":"/əˈpiːl/"},{"word":"appetite","pos":"n.","meaning":"食欲；胃口","ipa":"/ˈæpɪtaɪt/"}],"note":"appeal 呼吁/吸引、appetite 食欲，拼写前半像；appeal to sb 吸引某人；lose one's appetite 没有胃口。"},{"id":"g565","level":"高中","source":"其他教材","words":[{"word":"appreciate","pos":"v.","meaning":"感激；欣赏","ipa":"/əˈpriːʃieɪt/"},{"word":"appropriate","pos":"adj.","meaning":"合适的","ipa":"/əˈprəʊpriət/"}],"note":"appreciate 感激（ate 结尾），appropriate 合适的（riate 结尾）；I'd appreciate it if... 是写作万能句。"},{"id":"g566","level":"高中","source":"其他教材","words":[{"word":"blast","pos":"n./v.","meaning":"爆炸","ipa":"/blɑːst/"},{"word":"burst","pos":"v./n.","meaning":"爆裂；突然发作","ipa":"/bɜːst/"}],"note":"blast 爆炸（bl-）、burst 爆裂（bur-）都用不规则过去式：blasted/burst。burst into tears 突然大哭。"},{"id":"g567","level":"高中","source":"其他教材","words":[{"word":"boast","pos":"v./n.","meaning":"吹嘘","ipa":"/bəʊst/"},{"word":"boost","pos":"v./n.","meaning":"促进；提高","ipa":"/buːst/"}],"note":"boast 吹嘘、boost 促进只差 a/o；boost the economy 促进经济；boast about/of 自夸。"},{"id":"g568","level":"高中","source":"其他教材","words":[{"word":"canal","pos":"n.","meaning":"运河","ipa":"/kəˈnæl/"},{"word":"cancel","pos":"v.","meaning":"取消","ipa":"/ˈkænsl/"}],"note":"canal 运河、cancel 取消只差 na/nc；the Panama Canal 巴拿马运河；cancel the meeting 取消会议。"},{"id":"g569","level":"高中","source":"其他教材","words":[{"word":"cart","pos":"n.","meaning":"手推车","ipa":"/kɑːt/ 雷电。"},{"id":"g586","level":"四级","source":"其他教材","words":[{"word":"nail","pos":"n./v.","meaning":"钉子；钉住","ipa":"/neɪl/"},{"word":"snail","pos":"n.","meaning":"蜗牛","ipa":"/sneɪl/"}],"note":"nail 钉子、snail 蜗牛只差 s；snail mail 蜗牛邮件指传统信件（对比电子邮件），nail down 敲定。"},{"id":"g587","level":"六级","source":"其他教材","words":[{"word":"naval","pos":"adj.","meaning":"海军的","ipa":"/ˈneɪvl/"},{"word":"navel","pos":"n.","meaning":"肚脐","ipa":"/ˈneɪvl/"}],"note":"naval 海军的、navel 肚脐只差 l/e；a naval base 海军基地；两个词读音都是 /ˈneɪvl/，考试考拼写辨析。"},{"id":"g588","level":"四级","source":"其他教材","words":[{"word":"opponent","pos":"n.","meaning":"对手","ipa":"/əˈpəʊnənt/"},{"word":"component","pos":"n.","meaning":"组成部分；部件","ipa":"/kəmˈpəʊnənt/"}],"note":"opponent 对手（op- 相对）、component 部件（com- 共同），词根 pon/pon 意为“放置”；拼写只差第二三个字母。"},{"id":"g589","level":"四级","source":"其他教材","words":[{"word":"overcome","pos":"v.","meaning":"克服","ipa":"/ˌəʊvəˈkʌm/"},{"word":"overtake","pos":"v.","meaning":"超过；赶上","ipa":"/ˌəʊvəˈteɪk/"}],"note":"over- 前缀家族：overcome 克服困难，overtake 超车/超过；过去式都变 came/took（overcame、overtook）。"},{"id":"g590","level":"四级","source":"其他教材","words":[{"word":"plaster","pos":"n.","meaning":"石膏；创可贴","ipa":"/ˈplɑːstə(r)/"},{"word":"disaster","pos":"n.","meaning":"灾难","ipa":"/dɪˈzɑːstə(r)/"}],"note":"plaster 石膏/创可贴、disaster 灾难只差 la/sta；a natural disaster 自然灾害；put a plaster on 贴创可贴。"},{"id":"g591","level":"四级","source":"其他教材","words":[{"word":"prince","pos":"n.","meaning":"王子","ipa":"/prɪns/"},{"word":"princess","pos":"n.","meaning":"公主","ipa":"/prɪnˈses/"}],"note":"prince 王子加 -ess 变成 princess 公主；注意 princess 双 s，重音在第一音节 /ˌprɪnˈses/ 前移。"},{"id":"g592","level":"四级","source":"其他教材","words":[{"word":"receipt","pos":"n.","meaning":"收据","ipa":"/rɪˈsiːt/"},{"word":"receive","pos":"v.","meaning":"收到","ipa":"/rɪˈsiːv/"}],"note":"receipt 收据的 p 不发音，读 /rɪˈsiːt/；receive 收到。动词 receive 变名词时加 -pt 变 receipt，拼写规则特殊。"},{"id":"g593","level":"四级","source":"其他教材","words":[{"word":"resign","pos":"v.","meaning":"辞职","ipa":"/rɪˈzaɪn/"},{"word":"design","po <script>
/* LEXI core —— 状态 / 存储 / TTS / 词典 API / 差异高亮 / 公共渲染 */
(function () {
  'use strict';
  var LEVELS = ['小学', '初中', '高中', '四级', '六级'];
  var TYPE_ALL = ['拼写相似', '发音相似', '词义相近'];
  var HOT = ['affect', 'quite', 'adapt', 'stationery', 'weather', 'access', 'price', 'desert'];

  function loadJSON(id) {
    try { return JSON.parse(document.getElementById(id).textContent); }
    catch (e) { console.error('数据解析失败', id, e); return null; }
  }

  // ── 存储 ──
  var LS = {
    get: function (k, def) {
      try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
      catch (e) { return def; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var bank = LS.get('yhbank_v1', null) || loadJSON('bank-data') || [];
  var types = loadJSON('types-data') || {};
  var pairs = loadJSON('pairs-data') || [];
  var examples = loadJSON('examples-data') || {};
  var bankOverridden = !!LS.get('yhbank_v1', null);

  var settings = LS.get('yh_settings_v1', { accent: 'US', rate: 0.9, autoSpeak: true });
  var favs = LS.get('yh_fav_v1', []);
  var notes = LS.get('yh_notes_v1', {});
  var customs = LS.get('yh_custom_v1', []);
  var hist = LS.get('yh_hist_v1', []);
  var dictCache = LS.get('yh_dict_v1', {});

  function saveSettings() { LS.set('yh_settings_v1', settings); }
  function saveFavs() { LS.set('yh_fav_v1', favs); }
  function saveNotes() { LS.set('yh_notes_v1', notes); }
  function saveCustoms() { LS.set('yh_custom_v1', customs); }
  function saveHist() {
    if (hist.length > 600) hist = hist.slice(hist.length - 600);
    LS.set('yh_hist_v1', hist);
  }
  function saveDict() {
    var keys = Object.keys(dictCache);
    if (keys.length > 400) {
      var keep = {}; keys.slice(-400).forEach(function (k) { keep[k] = dictCache[k]; });
      dictCache = keep;
    }
    LS.set('yh_dict_v1', dictCache);
  }

  // ── 工具 ──
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function normWord(w) {
    return String(w || '').toLowerCase().replace(/[^a-z0-9'’\-\s]/g, '').trim();
  }
  function levelIdx(l) { return LEVELS.indexOf(l); }
  function findGroupOf(word) {
    var q = normWord(word);
    for (var i = 0; i < bank.length; i++) {
      for (var j = 0; j < bank[i].words.length; j++) {
        if (normWord(bank[i].words[j].word) === q) return bank[i];
      }
    }
    return null;
  }
  function findWordInBank(word) {
    var g = findGroupOf(word);
    if (!g) return null;
    var q = normWord(word);
    for (var j = 0; j < g.words.length; j++) {
      if (normWord(g.words[j].word) === q) return { group: g, w: g.words[j] };
    }
    return null;
  }
  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayStrOf(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ── 字符差异（LCS 对齐）──
  function charDiff(a, b) {
    // 返回 {a: [{ch, same}], b: [...]}：差异字符 same=false
    var la = a.length, lb = b.length;
    var dp = [];
    for (var i = 0; i <= la; i++) { dp.push(new Array(lb + 1).fill(0)); }
    for (i = la - 1; i >= 0; i--) {
      for (var j = lb - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    var ra = [], rb = [];
    i = 0; j = 0;
    while (i < la && j < lb) {
      if (a[i] === b[j]) { ra.push({ ch: a[i], same: true }); rb.push({ ch: b[j], same: true }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ra.push({ ch: a[i], same: false }); i++; }
      else { rb.push({ ch: b[j], same: false }); j++; }
    }
    while (i < la) { ra.push({ ch: a[i], same: false }); i++; }
    while (j < lb) { rb.push({ ch: b[j], same: false }); j++; }
    var da = ra.filter(function (x) { return !x.same; }).length;
    var db = rb.filter(function (x) { return !x.same; }).length;
    return { a: ra, b: rb, count: da + db, positions: Math.max(da, db) };
  }
  function renderDiff(tokens) {
    var out = tokens.map(function (t) {
      return t.same ? esc(t.ch) : '<span class="diff-mark">' + esc(t.ch) + '</span>';
    }).join('');
    return out;
  }
  function markDiff(wordA, wordB) {
    var d = charDiff(wordA.toLowerCase(), wordB.toLowerCase());
    return {
      a: renderDiff(d.a), b: renderDiff(d.b), count: d.count, positions: d.positions,
      sameLen: wordA.length === wordB.length
    };
  }
  // 按单词首字母对齐的高亮（用于同组内任意两个词的差异，以基准词视角）
  function diffAgainst(base, others) {
    return others.map(function (o) {
      var m = markDiff(base, o);
      return { html: m.b, count: m.count };
    });
  }

  // ── IPA 差异 ──
  function ipaTokens(ipa) {
    // 去掉重音符号做对比，但保留展示原文
    return { raw: ipa, cmp: ipa.replace(/[ˈˌ]/g, '') };
  }
  function ipaDiffView(ipaA, ipaB) {
    var A = ipaTokens(ipaA), B = ipaTokens(ipaB);
    var m = markDiff(A.cmp, B.cmp);
    // markDiff 产出的是 cmp 视角的字符流，IPA 本身就是小写符号，无需恢复大小写
    return { a: m.a, b: m.b, count: m.count, positions: m.positions };
  }

  // ── TTS 发音引擎（APK 内用原生插件，网页内用 Web Speech）──
  var NATIVE_TTS = (function () {
    try {
      return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech);
    } catch (e) { return false; }
  })();
  var TTS = {
    ok: NATIVE_TTS || (typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined'),
    native: NATIVE_TTS,
    voices: [],
    _lang: function (accent) { return (accent || settings.accent) === 'UK' ? 'en-GB' : 'en-US'; },
    _rate: function (r) { var v = r || settings.rate; return v >= 0.5 ? Math.round(v * 2) / 2 : 0.5; },
    _pickVoice: function (accent) {
      if (!this.voices.length) this.voices = speechSynthesis.getVoices() || [];
      var want = accent === 'UK' ? ['en-GB'] : ['en-US'];
      var pool = this.voices.filter(function (v) { return want.indexOf(v.lang) !== -1 || v.lang.replace('_', '-') === want[0]; });
      if (!pool.length) pool = this.voices.filter(function (v) { return /^en/i.test(v.lang); });
      if (!pool.length) return null;
      var prefer = pool.filter(function (v) { return /female|Samantha|Zira|Google US|Google UK/i.test(v.name); });
      return (prefer[0] || pool[0]);
    },
    speak: function (text, opts) {
      opts = opts || {};
      if (this.native) {
        try {
          var T = window.Capacitor.Plugins.TextToSpeech;
          T.stop().catch(function () {});
          T.speak({ text: String(text), lang: this._lang(opts.accent), rate: this._rate(opts.rate), pitch: 1.0, volume: 1.0, category: 'ambient' })
            .catch(function (e) { toast('发音失败，请检查系统语音引擎'); });
        } catch (e) { toast('发音失败'); }
        return;
      }
      if (!this.ok) { toast('当前浏览器不支持语音合成'); return; }
      try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = this._lang(opts.accent);
        u.rate = this._rate(opts.rate);
        var v = this._pickVoice(opts.accent || settings.accent);
        if (v) u.voice = v;
        speechSynthesis.speak(u);
      } catch (e) { toast('发音失败：' + e.message); }
    },
    stop: function () {
      this._looping = false; clearTimeout(this._loopTimer);
      if (this.native) { try { window.Capacitor.Plugins.TextToSpeech.stop().catch(function () {}); } catch (e) {} }
      else if (this.ok) { try { speechSynthesis.cancel(); } catch (e) {} }
    },
    _loopTimer: null,
    _looping: false,
    speakPairLoop: function (a, b, accent) {
      var self = this;
      this.stop();
      this._looping = true;
      var step = 0;
      function one(w) {
        if (self.native) {
          return window.Capacitor.Plugins.TextToSpeech.speak({ text: w, lang: self._lang(accent), rate: self._rate(), pitch: 1.0, volume: 1.0, category: 'ambient' });
        }
        return new Promise(function (resolve, reject) {
          try {
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(w);
            u.lang = self._lang(accent);
            u.rate = self._rate();
            var v = self._pickVoice(accent || settings.accent);
            if (v) u.voice = v;
            u.onend = resolve; u.onerror = reject;
            speechSynthesis.speak(u);
          } catch (e) { reject(e); }
        });
      }
      function next() {
        if (!self._looping) return;
        var w = step % 2 === 0 ? a : b;
        one(w).then(function () {
          if (!self._looping) return;
          self._loopTimer = setTimeout(next, 700);
        }).catch(function () {
          if (!self._looping) return;
          self._loopTimer = setTimeout(next, 700);
        });
        step++;
      }
      next();
    },
    stopLoop: function () { this._looping = false; clearTimeout(this._loopTimer); this.stop(); },
    speakSeq: function (words, done) {
      var self = this;
      this.stop();
      var i = 0;
      function one(w) {
        if (self.native) {
          return window.Capacitor.Plugins.TextToSpeech.speak({ text: w, lang: self._lang(settings.accent), rate: self._rate(), pitch: 1.0, volume: 1.0, category: 'ambient' });
        }
        return new Promise(function (resolve, reject) {
          try {
            speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(w);
            u.lang = self._lang(settings.accent);
            u.rate = self._rate();
            var v = self._pickVoice(settings.accent);
            if (v) u.voice = v;
            u.onend = resolve; u.onerror = reject;
            speechSynthesis.speak(u);
          } catch (e) { reject(e); }
        });
      }

        if (i >= words.length) { if (done) done(); return; }

          self._loopTimer = setTimeout(next, 350);
        }).catch(function () {
          next();
        });
      }
      next();
    }
  };
  if (TTS.ok && !NATIVE_TTS) {
    speechSynthesis.onvoiceschanged = function () { TTS.voices = speechSynthesis.getVoices() || []; };
    TTS.voices = speechSynthesis.getVoices() || [];
  }

  // ── 在线词典（Free Dictionary API）──
  var DICT = {
    online: function () { return navigator.onLine !== false; },
    lookup: function (word) {
      var key = normWord(word);
      if (!key) return Promise.resolve(null);
      if (dictCache[key]) return Promise.resolve(dictCache[key]);
      if (!this.online()) return Promise.resolve({ error: '离线，且本地词库未收录该词' });
      var ctrl = ('AbortController' in window) ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      return fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(key), ctrl ? { signal: ctrl.signal } : {})
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (arr) {
          if (timer) clearTimeout(timer);
          if (!Array.isArray(arr) || !arr.length) throw new Error('无结果');
          var e = arr[0];
          var out = { word: e.word || key, ipa: '', audio: '', defs: [], src: 'dict' };
          (e.phonetics || []).concat(e.phonetic ? [{ text: e.phonetic }] : []).some(function (p) {
            if (p.text && !out.ipa) out.ipa = p.text;
            if (p.audio && !out.audio) out.audio = p.audio;
            return out.ipa && out.audio;

            var d0 = (m.definitions || [])[0] || {};
            out.defs.push({ pos: m.partOfSpeech || '', def: d0.definition || '', ex: d0.example || '' });
          });

          saveDict();
          return out;
        })
        .catch(function (err) {
          if (timer) clearTimeout(timer);
          var msg = err && err.name === 'AbortError' ? '查询超时' : '词典服务不可用';
          return { error: msg };
        });
    },
    playAudio: function (url, fallbackWord) {
      if (!url) { TTS.speak(fallbackWord); return; }
      try {
        var au = new Audio(url);
        au.play().catch(function () { TTS.speak(fallbackWord); });
      } catch (e) { TTS.speak(fallbackWord); }
    }
  };

  // ── 类型标签 ──
  var openGroups = {};
  function typesOf(g) {
    if (g._types) return g._types;
    var t = types[g.id];
    if (!t) {
      // 自定义组等：现场计算拼写相似兜底
      var ws = g.words.map(function (w) { return normWord(w.word); });
      var min = 9;
      for (var i = 0; i < ws.length; i++) for (var j = i + 1; j < ws.length; j++) {
        var d = charDiff(ws[i], ws[j]);
        var dl = d.a.filter(function (x) { return !x.same; }).length;
        min = Math.min(min, dl);
      }
      t = [min <= 2 ? '拼写相似' : '词义相近'];
    }
    g._types = t;
    return t;
  }

  // ── 收藏 ──
  function isFav(id) { return favs.indexOf(id) !== -1; }
  function toggleFav(id) {
    var i = favs.indexOf(id);
    if (i === -1) { favs.push(id); toast('已加入我的词库'); }
    else { favs.splice(i, 1); toast('已取消收藏'); }
    saveFavs();
  }

  // ── 公共渲染 ──
  function badgeHtml(g) {
    var t = typesOf(g).map(function (x) { return '<span class="badge b-type">' + esc(x) + '</span>'; }).join('');
    return '<span class="badge b-level">' + esc(g.level) + '</span>' + t;
  }
  function playBtn(word) {
    return '<button class="play-btn" data-play="' + esc(word) + '" title="播放">' +
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>';
  }
  function examplesHtml(g) {
    var e = examples[g.id];
    if (!e || !g.words.some(function (w) { return e.s && e.s[normWord(w.word)]; })) return '';
    var rows = g.words.map(function (w) {
      var k = normWord(w.word);
      var s = e.s[k]; if (!s) return '';
      var col = e.c && e.c[k] ? '<span class="ex-col">常用搭配：' + esc(e.c[k]) + '</span>' : '';
      var rx = new RegExp('(' + String(w.word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'i');
      var html = esc(s).replace(rx, '<span class="ex-word">$1</span>');
      return '<div class="example-row">' + html + col + '</div>';
    }).filter(Boolean).join('');
    if (!rows) return '';
    return '<div class="examples"><div class="card-title" style="font-size:13px;margin-bottom:6px">参考例句<span class="src-badge">精选例句 · 离线可用</span></div>' + rows + '</div>';
  }
  // 词组卡片（展开式）
  function groupCard(g, opts) {
    opts = opts || {};
