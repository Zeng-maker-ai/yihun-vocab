    var open = opts.open || openGroups[g.id];
    // 记忆展开状态（data-expand 点击时同步）
    var ws = g.words;
    var summary = ws.map(function (w) { return esc(w.word); }).join(' / ');
    var fav = isFav(g.id);
    var head =
      '<div class="group-top">' +
        '<h3 class="group-words">' + summary + '</h3>' +
        '<div class="badges">' + badgeHtml(g) + '</div>' +
        '<button class="fav-btn' + (fav ? ' on' : '') + '" data-fav="' + esc(g.id) + '">' + (fav ? '♥' : '♡') + '</button>' +
      '</div>';
    if (!open) {
      return '<div class="group" data-gid="' + esc(g.id) + '">' + head +
        '<div class="group-body"><button class="more-btn" data-expand="' + esc(g.id) + '">展开辨析 ▾</button></div></div>';
    }
    // 展开态：并排词栏 + 差异高亮（第一个词 vs 其余）
    var base = normWord(ws[0].word);
    var cols = ws.map(function (w, idx) {
      var en = esc(w.word);
      if (q && normWord(w.word).indexOf(q) !== -1) {
        en = esc(w.word).replace(new RegExp('(' + String(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
      } else if (ws.length === 2 && idx === 1) {
        en = renderDiff(charDiff(base, normWord(w.word)).b);
      }
      return '<div class="word-col">' + playBtn(w.word) +
        '<span class="word-en">' + en + '</span>' +
        (w.ipa ? '<span class="word-ipa">' + esc(w.ipa) + '</span>' : '') +
        (w.pos ? '<span class="word-pos">' + esc(w.pos) + '</span>' : '') +
        '<span class="word-mean">' + esc(w.meaning) + '</span>' +
      '</div>';
    }).join('');
    var extras = '';
    var gid = esc(g.id);
    if (ws.length === 2) {
      var md = markDiff(ws[0].word, ws[1].word);
      extras += '<div class="sum-line">拼写相差 <b>' + md.positions + '</b> 处字母' + (md.sameLen ? '（两词等长，逐位对照）' : '（长度不同，注意多出/缺少的部分）') + ' · 点击喇叭可听发音对比</div>';
    }
    var noteHtml = '<div class="note"><b>辨析：</b>' + esc(g.note) + '</div>';
    var userNote = notes[g.id];
    var myNote = userNote ? '<div class="note" style="background:var(--accent-weak);color:var(--accent)">我的备注：' + esc(userNote) + '</div>' : '';
    return '<div class="group" data-gid="' + gid + '">' + head +
      '<div class="group-body">' +
        '<div class="word-cols">' + cols + '</div>' +
        extras + noteHtml + myNote + examplesHtml(g) +
        '<div class="diff-controls">' +
          (ws.length === 2 ? '<button class="btn ghost small" data-loop="' + esc(ws[0].word) + '|' + esc(ws[1].word) + '">循环对比发音</button>' : '') +
          '<button class="btn ghost small" data-note="' + gid + '">备注</button>' +
          '<button class="btn ghost small" data-srs-now="' + gid + '">今晚复习</button>' +
        '</div>' +
        '<button class="more-btn" data-expand="' + gid + '">收起 ▴</button>' +
      '</div></div>';
  }

  // ── 导航 ──
  var navBtns, pages;
  function switchNav(name) {
    navBtns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-nav') === name); });
    Object.keys(pages).forEach(function (k) { pages[k].classList.toggle('active', k === name); });
    window.scrollTo(0, 0);
    if (name === 'train') App.train.renderHome();
    if (name === 'mine') App.mine.render();
    if (name === 'library') App.library.render();
    if (name === 'home') App.home.renderStats();
  }

  var App = {
    LEVELS: LEVELS, TYPE_ALL: TYPE_ALL, HOT: HOT,
    bank: bank, examples: examples, pairs: pairs,
    settings: settings, favs: favs, notes: notes, customs: customs, hist: hist, dictCache: dictCache,
    bankOverridden: bankOverridden,
    $: $, esc: esc, normWord: normWord, levelIdx: levelIdx, LS: LS,
    findGroupOf: findGroupOf, findWordInBank: findWordInBank,
    saveSettings: saveSettings, saveFavs: saveFavs, saveNotes: saveNotes, saveCustoms: saveCustoms, saveHist: saveHist,
    saveBank: function () { LS.set('yhbank_v1', bank); bankOverridden = true; },
    resetBank: function () { LS.del('yhbank_v1'); bank = loadJSON('bank-data') || []; bankOverridden = false; },
    charDiff: charDiff, markDiff: markDiff, diffAgainst: diffAgainst, ipaDiffView: ipaDiffView,
    TTS: TTS, DICT: DICT, typesOf: typesOf,
    isFav: isFav, toggleFav: toggleFav,
    badgeHtml: badgeHtml, groupCard: groupCard, examplesHtml: examplesHtml,
    toast: toast, todayStr: todayStr, todayStrOf: todayStrOf, switchNav: switchNav,
    histPush: function (gid, mode, ok) {
      hist.push({ t: Date.now(), g: gid, m: mode, ok: ok ? 1 : 0 });
      saveHist();
    },
    refreshBank: function () {
      bank = LS.get('yhbank_v1', null) || loadJSON('bank-data') || [];
      App.bank = bank;
    }
  };
  window.App = App;

  function bindCommon() {
    navBtns = Array.prototype.slice.call(document.querySelectorAll('#bottomnav button'));
    pages = { home: $('page-home'), library: $('page-library'), train: $('page-train'), mine: $('page-mine') };
    navBtns.forEach(function (b) {
      b.addEventListener('click', function () { TTS.stopLoop(); switchNav(b.getAttribute('data-nav')); });
    });
    // 全局委托：发音 / 收藏 / 展开 / 循环 / 备注 / 复习
    document.addEventListener('click', function (ev) {
      var el = ev.target.closest ? ev.target.closest('[data-play],[data-fav],[data-expand],[data-loop],[data-note],[data-srs-now]') : null;
      if (!el) return;
      if (el.hasAttribute('data-play')) {
        TTS.speak(el.getAttribute('data-play'));
        ev.stopPropagation();
      } else if (el.hasAttribute('data-fav')) {
        var gid = el.getAttribute('data-fav');
        toggleFav(gid);
        el.classList.toggle('on', isFav(gid));
        el.textContent = isFav(gid) ? '♥' : '♡';
        if (App.library && App.library.onFavChange) App.library.onFavChange();
      } else if (el.hasAttribute('data-expand')) {
        var id = el.getAttribute('data-expand');
        openGroups[id] = !openGroups[id];
        var g = bank.filter(function (x) { return x.id === id; })[0] || customs.filter(function (x) { return x.id === id; })[0];
        if (g) el.closest('.group').outerHTML = groupCard(g, {});
      } else if (el.hasAttribute('data-loop')) {
        var ws = el.getAttribute('data-loop').split('|');
        if (el._looping) {
          TTS.stopLoop();
          el._looping = false;
          el.textContent = '循环对比发音';
        } else {
          TTS.speakPairLoop(ws[0], ws[1], App.settings.accent);
          el._looping = true;
          el.textContent = '停止循环';
          toast('正在循环对比 ' + ws[0] + ' / ' + ws[1]);
        }
      } else if (el.hasAttribute('data-note')) {
        App.library.openNoteModal(el.getAttribute('data-note'));
      } else if (el.hasAttribute('data-srs-now')) {
        App.srs.setDueToday(el.getAttribute('data-srs-now'));
        toast('已加入今晚复习');
      }
    });
    document.addEventListener('click', function (ev) {
      if (ev.target.id === 'modal-mask') closeModal();
    });
  }
  function openModal(html) { $('modal-body').innerHTML = html; $('modal-mask').classList.add('open'); }
  function closeModal() { $('modal-mask').classList.remove('open'); $('modal-body').innerHTML = ''; }
  App.openModal = openModal;
  App.closeModal = closeModal;

  function renderAppbar() {
    var words = {};
    bank.forEach(function (g) { g.words.forEach(function (w) { words[normWord(w.word)] = 1; }); });
    var learned = App.srs ? App.srs.state.count() : 0;
    $('appbar-stats').innerHTML = '词条 <b>' + bank.length + '</b> 组 · 单词 <b>' + Object.keys(words).length + '</b> 个<br>已学 <b>' + learned + '</b> 组';
  }
  App.renderAppbar = renderAppbar;

  document.addEventListener('DOMContentLoaded', function () {
    bindCommon();
    App.srs.init();
    App.home.init();
    App.library.init();
    App.train.init();
    App.mine.init();
    renderAppbar();
    if (!TTS.ok) toast('当前浏览器不支持语音合成，发音功能不可用');
  });
})();

</script>
<script>
/* LEXI srs —— 间隔重复（SM-2 简化实现，思路参考 FSRS/Anki） */
(function () {
  'use strict';
  var A = window.App;
  var KEY = 'yh_srs_v1';
  var state = A.LS.get(KEY, {});

  function save() { A.LS.set(KEY, state); }

  function g(id) {
    if (!state[id]) {
      state[id] = { ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0, ok: 0, ng: 0, last: 0 };
    }
    return state[id];
  }
  function has(id) { return !!state[id]; }
  function remove(id) { delete state[id]; save(); }

  // 答题：correct=true/false；streak 由训练模块传入（连续答对次数，用于微调）
  function grade(id, correct, streak) {
    var s = g(id);
    var now = Date.now();
    s.last = now;
    if (correct) {
      s.ok++;
      s.reps++;
      if (s.ivl === 0) s.ivl = 1;
      else if (s.ivl === 1) s.ivl = 3;
      else if (s.ivl === 3) s.ivl = 7;
      else s.ivl = Math.min(180, Math.round(s.ivl * s.ease));
      if ((streak || 0) >= 3 && s.ease < 3.0) s.ease += 0.03;
      s.due = now + s.ivl * 86400000;
    } else {
      s.ng++;
      s.lapses++;
      s.reps = 0;
      s.ivl = 0;
      s.due = now;                       // 当天再复习
      s.ease = Math.max(1.6, s.ease - 0.2);
    }
    save();
    return s;
  }

  function setDueToday(id) { var s = g(id); s.due = Date.now(); s.ivl = Math.max(0, s.ivl); save(); }

  function dueList(now) {
    now = now || Date.now();
    var out = [];
    Object.keys(state).forEach(function (id) {
      if (state[id].due && state[id].due <= now) out.push({ id: id, s: state[id] });
    });
    // 常错优先，其次到期早的
    out.sort(function (a, b) {
      if (b.s.lapses !== a.s.lapses) return b.s.lapses - a.s.lapses;
      return a.s.due - b.s.due;
    });
    return out;
  }

  function dueCount() { return dueList().length; }

  function count() { return Object.keys(state).filter(function (k) { return state[k].reps > 0 || state[k].ng > 0; }).length; }

  // 掌握度分档
  function level(id) {
    var s = state[id];
    if (!s || (s.reps === 0 && s.ng === 0)) return 'none';      // 未开始
    if (s.ivl >= 21 && s.ok > s.ng) return 'mastered';          // 已掌握
    return 'learning';                                          // 学习中
  }
  function masteryCounts() {
    var c = { none: 0, learning: 0, mastered: 0 };
    A.bank.forEach(function (gp) { c[level(gp.id)]++; });
    A.customs.forEach(function (gp) { c[level(gp.id)]++; });
    return c;
  }
  function accuracy() {
    var ok = 0, ng = 0;
    Object.keys(state).forEach(function (k) { ok += state[k].ok; ng += state[k].ng; });
    return { ok: ok, ng: ng, rate: (ok + ng) ? Math.round(ok * 100 / (ok + ng)) : null };
  }
  // 连续学习天数（按学习历史中的自然日）
  function streakDays() {
    var days = {};
    A.hist.forEach(function (h) { days[A.todayStrOf(h.t)] = 1; });
    var n = 0;
    var d = new Date();
    for (;;) {
      var key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (days[key]) { n++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return n;
  }
  function weakest(n) {
    return Object.keys(state)
      .filter(function (k) { return state[k].ng > 0; })
      .sort(function (a, b) { return state[b].ng - state[a].ng || state[b].lapses - state[a].lapses; })
      .slice(0, n || 8);
  }

  A.srs = {
    init: function () {},
    state: { get: function (id) { return has(id) ? state[id] : null; }, count: count, remove: remove },
    grade: grade, setDueToday: setDueToday,
    dueList: dueList, dueCount: dueCount,
    level: level, masteryCounts: masteryCounts, accuracy: accuracy,
    streakDays: streakDays, weakest: weakest,
    save: save,
    exportAll: function () { return JSON.parse(JSON.stringify(state)); },
    clearAll: function () { state = {}; save(); }
  };
})();

</script>
<script>
/* LEXI home —— 首页查词 + 两词对比辨析 */
(function () {
  'use strict';
  var A = window.App;
  var searchInput, suggestionsEl, searchResults;
  var levelFilter = '全部';
  var openGroups = {};

  function levenshtein(a, b) {
    if (a === b) return 0;
    var la = a.length, lb = b.length;
    if (!la) return lb;
    if (!lb) return la;
    var prev = new Array(lb + 1), cur = new Array(lb + 1);
    for (var j = 0; j <= lb; j++) prev[j] = j;
    for (var i = 1; i <= la; i++) {
      cur[0] = i;
      for (var j2 = 1; j2 <= lb; j2++) {
        var cost = a[i - 1] === b[j2 - 1] ? 0 : 1;
        cur[j2] = Math.min(prev[j2] + 1, cur[j2 - 1] + 1, prev[j2 - 1] + cost);
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[lb];
  }

  function matchGroup(g, q) {
    var bestTier = Infinity, bestScore = Infinity, matched = '';
    g.words.forEach(function (w) {
      var wl = A.normWord(w.word);
      if (!wl) return;
      var tier, score;
      if (wl === q) { tier = 0; score = 0; }
      else if (wl.indexOf(q) === 0 || (q.indexOf(wl) === 0 && wl.length >= 4)) { tier = 1; score = wl.length - q.length; }
      else if (wl.indexOf(q) !== -1 && (q.length >= 4 || wl.length - q.length <= 2)) { tier = 2; score = wl.indexOf(q); }
      else {
        var d = levenshtein(wl, q);
        var maxD = q.length >= 5 ? 2 : 1;
        if (d > maxD) return;
        if (q.length <= 4 && (wl.length !== q.length || wl.charAt(0) !== q.charAt(0))) return;
        tier = 3; score = 3 + d;
      }
      if (tier < bestTier || (tier === bestTier && score < bestScore)) {
        bestTier = tier; bestScore = score; matched = wl;
      }
    });
    if (bestTier === Infinity) return null;
    return { tier: bestTier, score: bestScore, matched: matched };
  }

  function filteredBank() {
    if (levelFilter === '全部') return A.bank;
    return A.bank.filter(function (g) { return g.level === levelFilter; });
  }

  function runSearch() {
    var q = A.normWord(searchInput.value);
    if (!q) { renderSearchEmpty(); return; }
    var exact = [], fuzzy = [];
    filteredBank().forEach(function (g) {
      var r = matchGroup(g, q);
      if (!r) return;
      var item = { g: g, tier: r.tier, score: r.score };
      (r.tier <= 2 ? exact : fuzzy).push(item);
    });
    function sortHits(a, b) {
      if (a.tier !== b.tier) return a.tier - b.tier;
      if (a.score !== b.score) return a.score - b.score;
      return a.g.id.localeCompare(b.g.id);
    }
    exact.sort(sortHits); fuzzy.sort(sortHits);
    var html = '';
    if (exact.length || fuzzy.length) {
      html += '<div class="result-head"><span>直接命中 ' + exact.length + ' 组' +
        (fuzzy.length ? ' · 相近拼写 ' + fuzzy.length + ' 组' : '') + '</span>' +
        (levelFilter !== '全部' ? '<span>当前难度：' + A.esc(levelFilter) + '</span>' : '') + '</div>';
    }
    if (!exact.length && !fuzzy.length) {
      html += '<div class="empty">未找到相关词条。试试相近拼写，或用上方"两词对比"直接辨析。</div>';
    } else {
      exact.slice(0, 30).forEach(function (h) {
        var needOpen = exact.length <= 6;
        html += A.groupCard(h.g, { query: q, open: openGroups[h.g.id] || needOpen });
      });
      if (fuzzy.length) {
        html += '<div class="browse-head"><span class="bh-title">相近拼写</span>近似匹配，供参考</div>';
        fuzzy.slice(0, 6).forEach(function (h) { html += A.groupCard(h.g, { query: q, open: false }); });
      }
    }
    searchResults.innerHTML = html;
  }

  function renderSearchEmpty() {
    searchResults.innerHTML = '<div class="empty">输入单词后，会匹配与之相关的易混词条；也可以直接在上方输入两个单词做对比。</div>';
  }

  function renderSuggestions() {
    var q = A.normWord(searchInput.value);
    if (!q) { suggestionsEl.hidden = true; return; }
    var seen = {}, items = [];
    filteredBank().forEach(function (g) {
      g.words.forEach(function (w) {
        var wl = A.normWord(w.word);
        if (!wl || seen[wl]) return;
        var score = wl.indexOf(q) === 0 ? 0 : (wl.indexOf(q) !== -1 && (q.length >= 4 || wl.length - q.length <= 2) ? 1 : 2);
        if (score > 1) return;
        seen[wl] = true;
        items.push({ w: w, wl: wl, score: score });
      });
    });
    items.sort(function (a, b) {
      if (a.score !== b.score) return a.score - b.score;
      return a.wl.length - b.wl.length;
    });
    items = items.slice(0, 8);
    if (!items.length) { suggestionsEl.hidden = true; return; }
    suggestionsEl.innerHTML = items.map(function (it) {
      return '<li data-word="' + A.esc(it.w.word) + '">' +
        '<span class="sug-word">' + A.esc(it.w.word) + '</span>' +
        '<span class="sug-ipa">' + (it.w.ipa ? A.esc(it.w.ipa) : '') + '</span>' +
        '<span class="sug-mean">' + A.esc(it.w.meaning) + '</span></li>';
    }).join('');
    suggestionsEl.hidden = false;
  }

  function renderHot() {
    var html = A.HOT.map(function (w) { return '<button data-hot="' + A.esc(w) + '">' + A.esc(w) + '</button>'; }).join('');
    document.getElementById('hotwords').innerHTML = html;
  }

  // ───────────── 两词对比 ─────────────
  function resolveWord(word) {
    // 返回 {word, pos, meaning, ipa, src: 'bank'|'dict'|'none', note?, group?, ex? , col?}
    var hit = A.findWordInBank(word);
    if (hit) {
      var e = A.examples[hit.group.id] || {};
      var k = A.normWord(word);
      return {
        word: hit.w.word, pos: hit.w.pos || '', meaning: hit.w.meaning || '', ipa: hit.w.ipa || '',
        src: 'bank', group: hit.group, note: hit.group.note,
        ex: e.s && e.s[k], col: e.c && e.c[k]
      };
    }
    return { word: word, pos: '', meaning: '', ipa: '', src: 'none' };
  }

  function fetchDict(r) {
    if (r.src === 'none' || (!r.ipa && r.src === 'none')) {
      return A.DICT.lookup(r.word).then(function (d) {
        if (d && !d.error) {
          r.ipa = r.ipa || d.ipa || '';
          r.meaning = r.meaning || (d.defs && d.defs.length ? d.defs.map(function (x) { return x.def; }).join('；') : '');
          r.pos = r.pos || (d.defs && d.defs[0] ? d.defs[0].pos : '');
          r.audio = d.audio || '';
          r.defs = d.defs || [];
          r.ex = r.ex || (d.defs && d.defs[0] ? d.defs[0].ex : '');
          r.src = 'dict';
        } else {
          r.err = (d && d.error) || '未查询到';
        }
        return r;
      });
    }
    // 词库词也可能有真人音频
    return A.DICT.lookup(r.word).then(function (d) {
      if (d && !d.error) r.audio = d.audio || '';
      return r;
    });
  }

  function srcBadge(src) {
    if (src === 'bank') return '<span class="src-badge">内置词库</span>';
    if (src === 'dict') return '<span class="src-badge">在线词典实时查询</span>';
    return '<span class="src-badge">未收录</span>';
  }

  function compareView(w1, w2) {
    var body = document.getElementById('compare-body');
    var r1 = resolveWord(w1), r2 = resolveWord(w2);
    document.getElementById('compare-view').classList.add('open');
    var md = A.markDiff(r1.word, r2.word);
    var ipaD = (r1.ipa && r2.ipa) ? A.ipaDiffView(r1.ipa, r2.ipa) : null;
    var sameGroup = r1.group && r2.group && r1.group.id === r2.group.id;
    var head =
      '<div style="height:14px"></div>' +
      '<div class="card"><div class="card-title">拼写差异<span class="src-badge">' + md.positions + ' 处不同</span></div>' +
        '<div class="diff-row"><div class="diff-cell">' + md.a + '<span class="lbl">单词 1</span></div>' +
        '<div class="diff-cell">' + md.b + '<span class="lbl">单词 2</span></div></div>' +
        '<div class="sum-line">' + (md.count === 0 ? '两词拼写完全相同（应为同音词或大小写差异）。' :
          (md.sameLen ? '两词等长，仅差 ' + md.positions + ' 个字母，最易看错写错。' : '两词长度不同，注意多出/缺少的字母部分。')) + '</div></div>';

    var pronHtml =
      '<div class="card"><div class="card-title">发音与音标</div>' +
        '<div class="cp-row"><div class="cp-col"><span class="cp-word">' + A.esc(r1.word) + '</span> ' + playW(r1) + '<div class="cp-ipa" data-ipa-slot="1">' + (r1.ipa ? A.esc(r1.ipa) : '查询中…') + '</div></div></div>' +
        '<div class="cp-row"><div class="cp-col"><span class="cp-word">' + A.esc(r2.word) + '</span> ' + playW(r2) + '<div class="cp-ipa" data-ipa-slot="2">' + (r2.ipa ? A.esc(r2.ipa) : '查询中…') + '</div></div></div>' +
        '<div class="audio-line">' +
          '<button class="btn ghost small" id="cmp-seq">连续播放 1→2</button>' +
          '<button class="btn ghost small" id="cmp-loop">循环对比</button>' +
          '<button class="btn ghost small" id="cmp-accent">口音：' + (A.settings.accent === 'UK' ? '英式' : '美式') + '</button>' +
        '</div>' +
        '<div id="cmp-ipa-diff"></div>' +
      '</div>';

    var meanHtml =
      '<div class="card"><div class="card-title">词义与语境</div>' +
        '<div class="def-item" data-def-slot="1"><span class="dp">' + A.esc(r1.pos || '') + '</span><span class="dd">' + (r1.meaning ? A.esc(r1.meaning) : '查询中…') + '</span>' + srcBadge(r1.src) + '</div>' +
        '<div class="def-item" data-def-slot="2"><span class="dp">' + A.esc(r2.pos || '') + '</span><span class="dd">' + (r2.meaning ? A.esc(r2.meaning) : '查询中…') + '</span>' + srcBadge(r2.src) + '</div>' +
        '<div id="cmp-distinct"></div>' +
      '</div>';

    var exHtml =
      '<div class="card"><div class="card-title">典型例句与搭配</div>' +
        '<div data-ex-slot="1">' + (r1.ex ? exLine(r1) : (r1.src === 'none' ? '<div class="loading">查询中…</div>' : '<span class="src-badge">暂无精选例句</span>')) + '</div>' +
        '<div data-ex-slot="2">' + (r2.ex ? exLine(r2) : (r2.src === 'none' ? '<div class="loading">查询中…</div>' : '<span class="src-badge">暂无精选例句</span>')) + '</div>' +
      '</div>';

    var memHtml = '<div class="card"><div class="card-title">记忆技巧与总结</div><div id="cmp-memory"></div>' +
      '<div style="margin-top:10px"><button class="btn block" id="cmp-save">把这对词存入我的词库</button></div></div>';

    body.innerHTML = head + pronHtml + meanHtml + exHtml + memHtml;

    // 在线补全
    Promise.all([fetchDict(r1), fetchDict(r2)]).then(function () {
      var slot1 = body.querySelector('[data-ipa-slot="1"]'), slot2 = body.querySelector('[data-ipa-slot="2"]');
      if (slot1) slot1.textContent = r1.ipa || (r1.err ? '未查到（' + r1.err + '）' : '—');
      if (slot2) slot2.textContent = r2.ipa || (r2.err ? '未查到（' + r2.err + '）' : '—');
      // 音标差异（若两者都有）
      if (r1.ipa && r2.ipa) {
        var d = A.ipaDiffView(r1.ipa, r2.ipa);
        document.getElementById('cmp-ipa-diff').innerHTML =
          '<div class="diff-row" style="margin-top:8px"><div class="diff-cell">' + d.a + '<span class="lbl">音标 1</span></div>' +
          '<div class="diff-cell">' + d.b + '<span class="lbl">音标 2</span></div></div>' +
          '<div class="sum-line">' + ipaSummary(r1, r2) + '</div>';
      }
      // 词义补全
      var d1 = body.querySelector('[data-def-slot="1"]'), d2 = body.querySelector('[data-def-slot="2"]');
      if (d1) d1.innerHTML = (r1.src === 'dict' && r1.defs) ? defsHtml(r1) : failHtml(r1);
      if (d2) d2.innerHTML = (r2.src === 'dict' && r2.defs) ? defsHtml(r2) : failHtml(r2);
      // 例句补全
      var e1 = body.querySelector('[data-ex-slot="1"]'), e2 = body.querySelector('[data-ex-slot="2"]');
      if (e1 && r1.src === 'dict') e1.innerHTML = r1.ex ? exLine(r1) : '<span class="src-badge">词典未提供例句</span>';
      else if (e1 && r1.err) e1.innerHTML = '<div class="loading">联网后可自动查询词典例句（当前：' + A.esc(r1.err) + '）</div>';
      if (e2 && r2.src === 'dict') e2.innerHTML = r2.ex ? exLine(r2) : '<span class="src-badge">词典未提供例句</span>';
      else if (e2 && r2.err) e2.innerHTML = '<div class="loading">联网后可自动查询词典例句（当前：' + A.esc(r2.err) + '）</div>';
      renderDistinct(r1, r2);
      renderMemory(r1, r2, md);
      bindCompareActions(r1, r2);
    });
    renderDistinct(r1, r2);
    bindCompareActions(r1, r2);
  }

  function playW(r) {
    return '<button class="play-btn" style="position:static;display:inline-flex;margin-left:6px" data-cplay="' + A.esc(r.word) + '">' +
      '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>';
  }
  function exLine(r) {
    var s = A.esc(r.ex);
    var rx = new RegExp('(' + String(r.word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)', 'i');
    s = s.replace(rx, '<span class="ex-word">$1</span>');
    var col = r.col ? ' <span class="ex-col">常用搭配：' + A.esc(r.col) + '</span>' : '';
    return '<div class="example-row">' + s + col + '</div>';
  }
  function defsHtml(r) {
    if (!r.defs || !r.defs.length) return '<span class="src-badge">词典未提供释义</span>';
    return r.defs.slice(0, 3).map(function (d) {
      return '<div class="def-item"><span class="dp">' + A.esc(d.pos) + '</span><span class="dd">' + A.esc(d.def) + '</span>' +
        (d.ex ? '<span class="de">例：' + A.esc(d.ex) + '</span>' : '') + '</div>';
    }).join('') + '<div style="margin-top:6px">' + srcBadge('dict') + '</div>';
  }
  function failHtml(r) {
    var head = r.meaning ? '<span class="dp">' + A.esc(r.pos || '') + '</span><span class="dd">' + A.esc(r.meaning) + '</span>' : '';
    var tip = r.err ? '<div class="loading">联网后可自动查询词典补充释义（当前：' + A.esc(r.err) + '）</div>'
                    : '<div class="loading">本地词库未收录该词，联网后可自动查询词典补充。</div>';
    return head + '<div style="margin-top:4px">' + srcBadge('none') + '</div>' + tip;
  }
  function ipaSummary(r1, r2) {
    var d = A.ipaDiffView(r1.ipa, r2.ipa);
    if (d.count === 0) return '两词音标完全相同 —— 同音异形词，只能靠拼写和词义区分，听音无法分辨。';
    return '两词音标相差 ' + d.positions + ' 处（黄色标记）。注意听发音中的差别，不要凭拼写猜读音。';
  }
  function renderDistinct(r1, r2) {
    var el = document.getElementById('cmp-distinct');
    if (!el) return;
    var html = '';
    if (r1.note && r2.note && r1.group.id === r2.group.id) {
      html += '<div class="sum-line">这两词来自词库同一组：<b>' + A.esc(r1.note) + '</b></div>';
    } else {
      if (r1.note) html += '<div class="sum-line">' + A.esc(r1.word) + ' 的辨析要点：' + A.esc(r1.note) + '</div>';
      if (r2.note && (!r1.note || r1.note !== r2.note)) html += '<div class="sum-line">' + A.esc(r2.word) + ' 的辨析要点：' + A.esc(r2.note) + '</div>';
    }
    if (!html) {
      if (r1.err && r2.err) html = '<div class="loading">内置词库未收录这两词，且当前查询词典失败（' + A.esc(r1.err) + '）。联网后重新对比即可获取完整辨析。</div>';
      else html = '<div class="loading">' + (A.DICT.online() ? '正在结合词典释义归纳区别…' : '当前离线：内置词库未收录这两词，联网后可获取完整辨析。') + '</div>';
    }
    el.innerHTML = html;
  }
  function renderMemory(r1, r2, md) {
    var el = document.getElementById('cmp-memory');
    if (!el) return;
    var tips = [];
    if (md.count > 0) tips.push('拼写上只差 ' + md.positions + ' 处，把差异字母抄写三遍加深印象。');
    if (r1.ipa && r2.ipa) {
      var d = A.ipaDiffView(r1.ipa, r2.ipa);
      tips.push(d.count === 0 ? '两词读音相同，记忆重心放在"哪个拼写对应哪个意思"。' : '读音有差别，多听几遍"连续播放"培养耳朵敏感度。');
    }
    if (r1.note || r2.note) tips.push('记住词库要点：' + A.esc((r1.note || r2.note).slice(0, 60)) + '…');
    if (!tips.length) tips.push('先用例句各造一个自己的句子，语境记忆最牢固。');
    el.innerHTML = '<div class="sum-line">' + tips.join('<br>') + '</div>';
  }
  function bindCompareActions(r1, r2) {
    var body = document.getElementById('compare-body');
    var seqBtn = document.getElementById('cmp-seq');
    var loopBtn = document.getElementById('cmp-loop');
    var accBtn = document.getElementById('cmp-accent');
    var saveBtn = document.getElementById('cmp-save');
    if (!seqBtn) return;
    body.querySelectorAll('[data-cplay]').forEach(function (b) {
      b.onclick = function () {
        var w = b.getAttribute('data-cplay');
        var r = w === r1.word ? r1 : r2;
        if (r.audio) A.DICT.playAudio(r.audio, w); else A.TTS.speak(w);
      };
    });
    seqBtn.onclick = function () { A.TTS.speakSeq([r1.word, r2.word]); };
    loopBtn.onclick = function () {
      if (loopBtn._on) { A.TTS.stopLoop(); loopBtn._on = false; loopBtn.textContent = '循环对比'; }
      else { A.TTS.speakPairLoop(r1.word, r2.word, A.settings.accent); loopBtn._on = true; loopBtn.textContent = '停止循环'; }
    };
    accBtn.onclick = function () {
      A.settings.accent = A.settings.accent === 'UK' ? 'US' : 'UK';
      A.saveSettings();
      accBtn.textContent = '口音：' + (A.settings.accent === 'UK' ? '英式' : '美式');
      loopBtn._on = false; loopBtn.textContent = '循环对比'; A.TTS.stopLoop();
    };
    saveBtn.onclick = function () { saveComparePair(r1, r2); };
  }
  function saveComparePair(r1, r2) {
    if (r1.group && r2.group && r1.group.id === r2.group.id) {
      if (!A.isFav(r1.group.id)) A.toggleFav(r1.group.id);
      A.toast('该组已在词库中，已为你收藏');
      return;
    }
    var id = 'u' + String(Date.now()).slice(-8);
    A.customs.push({
      id: id, level: '自定义', source: '两词对比',
      words: [
        { word: r1.word, pos: r1.pos, ipa: r1.ipa, meaning: r1.meaning || '（待补充）' },
        { word: r2.word, pos: r2.pos, ipa: r2.ipa, meaning: r2.meaning || '（待补充）' }
      ],
      note: (r1.note || r2.note) ? ('参考：' + ((r1.note || '') + ' ' + (r2.note || '')).trim()) : '（可稍后在"我的收藏"里补充辨析要点）'
    });
    A.saveCustoms();
    if (!A.isFav(id)) { A.favs.push(id); A.saveFavs(); }
    A.toast('已存入我的词库，可在"词库 → 我的收藏"查看');
  }

  // ───────────── 初始化 ─────────────
  function init() {
    searchInput = document.getElementById('search-input');
    suggestionsEl = document.getElementById('suggestions');
    searchResults = document.getElementById('search-results');
    renderHot();
    renderSearchEmpty();
    renderStats();

    var deb;
    searchInput.addEventListener('input', function () {
      clearTimeout(deb);
      deb = setTimeout(function () { renderSuggestions(); runSearch(); }, 160);
    });
    searchInput.addEventListener('focus', renderSuggestions);
    document.addEventListener('click', function (ev) {
      if (!ev.target.closest('.search-box')) suggestionsEl.hidden = true;
    });
    suggestionsEl.addEventListener('click', function (ev) {
      var li = ev.target.closest('li[data-word]');
      if (!li) return;
      searchInput.value = li.getAttribute('data-word');
      suggestionsEl.hidden = true;
      runSearch();
    });
    document.getElementById('hotwords').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-hot]');
      if (!b) return;
      searchInput.value = b.getAttribute('data-hot');
      runSearch();
    });
    searchResults.addEventListener('click', function (ev) {
      var ex = ev.target.closest('[data-expand]');
      if (ex) {
        var id = ex.getAttribute('data-expand');
        openGroups[id] = !openGroups[id];
      }
    });

    // 对比入口
    document.getElementById('cmp-go').addEventListener('click', goCompare);
    document.getElementById('cmp-swap').addEventListener('click', function () {
      var a = document.getElementById('cmp-w1'), b = document.getElementById('cmp-w2');
      var t = a.value; a.value = b.value; b.value = t;
    });
    ['cmp-w1', 'cmp-w2'].forEach(function (id) {
      document.getElementById(id).addEventListener('keydown', function (ev) { if (ev.key === 'Enter') goCompare(); });
    });
    document.getElementById('cmp-back').addEventListener('click', function () {
      A.TTS.stopLoop();
      document.getElementById('compare-view').classList.remove('open');
      document.getElementById('compare-body').innerHTML = '';
    });
  }
  function goCompare() {
    var w1 = A.normWord(document.getElementById('cmp-w1').value);
    var w2 = A.normWord(document.getElementById('cmp-w2').value);
    if (!w1 || !w2) { A.toast('请输入两个单词'); return; }
    if (w1 === w2) { A.toast('两个单词相同，请换一个词'); return; }
    compareView(w1, w2);
  }
  function renderStats() {
    var words = {};
    A.bank.forEach(function (g) { g.words.forEach(function (w) { words[A.normWord(w.word)] = 1; }); });
    document.getElementById('appbar-stats').innerHTML = '词条 <b>' + A.bank.length + '</b> 组 · 单词 <b>' + Object.keys(words).length + '</b> 个';
  }

  A.home = { init: init, renderStats: renderStats, compareView: compareView };
})();

</script>
<script>
/* LEXI library —— 全部词条 / 我的收藏 / 词库维护 */
(function () {
  'use strict';
  var A = window.App;
  var LEVELS = A.LEVELS, TYPES = A.TYPE_ALL;
  var levelFilter = '全部';
  var typeFilter = '全部';
  var libTab = 'all';
  var adminSearch = '';
  var editingId = null;

  function allGroups() { return A.bank.concat(A.customs); }
  function findGroup(id) {
    return allGroups().filter(function (g) { return g.id === id; })[0] || null;
  }

  // ── 全部词条 ──
  function renderLevelChips() {
    var opts = ['全部'].concat(LEVELS);
    document.getElementById('level-filter').innerHTML = opts.map(function (lv) {
      return '<button class="chip' + (lv === levelFilter ? ' active' : '') + '" data-level="' + lv + '">' + lv + '</button>';
    }).join('');
  }
  function renderTypeChips() {
    var opts = ['全部'].concat(TYPES);
    document.getElementById('type-filter').innerHTML = opts.map(function (tp) {
      return '<button class="chip' + (tp === typeFilter ? ' active' : '') + '" data-type="' + tp + '">' + tp + '</button>';
    }).join('');
  }
  function renderBrowse() {
    var pool = allGroups().filter(function (g) {
      if (levelFilter !== '全部' && g.level !== levelFilter) return false;
      if (typeFilter !== '全部' && A.typesOf(g).indexOf(typeFilter) === -1) return false;
      return true;
    });
    var html = '<div class="result-head"><span>共 ' + pool.length + ' 组</span><span>点击卡片展开辨析</span></div>';
    if (!pool.length) {
      html += '<div class="empty">当前筛选条件下暂无词条。</div>';
      document.getElementById('browse-list').innerHTML = html;
      return;
    }
    // 按难度分组展示
    var groups = {};
    LEVELS.forEach(function (lv) { groups[lv] = []; });
    var custom = [];
    pool.forEach(function (g) { if (g.level === '自定义') custom.push(g); else if (groups[g.level]) groups[g.level].push(g); });
    LEVELS.forEach(function (lv) {
      var list = groups[lv];
      if (!list.length) return;
      html += '<div class="browse-head"><span class="bh-title">' + lv + '</span><span>' + list.length + ' 组</span></div>';
      list.forEach(function (g) { html += A.groupCard(g, { open: false }); });
    });
    if (custom.length) {
      html += '<div class="browse-head"><span class="bh-title">自定义</span><span>' + custom.length + ' 组</span></div>';
      custom.forEach(function (g) { html += A.groupCard(g, { open: true }); });
    }
    document.getElementById('browse-list').innerHTML = html;
  }

  // ── 我的收藏 ──
  function renderFav() {
    var box = document.getElementById('lib-fav');
    var favGroups = A.favs.map(findGroup).filter(Boolean);
    var html = '<div class="page-head"><h2>我的收藏</h2><button class="btn small" id="add-custom">＋ 新建组合</button></div>';
    if (!favGroups.length) {
      html += '<div class="empty">还没有收藏。在词条卡片右上角点 ♥ 收藏，或把"两词对比"的结果一键存入。</div>';
    } else {
      favGroups.forEach(function (g) {
        html += A.groupCard(g, { open: true });
      });
    }
    var noteCount = Object.keys(A.notes).length;
    if (noteCount) html += '<div class="result-head"><span>已写备注 ' + noteCount + ' 条 · 长按词条下方"备注"可修改</span></div>';
    box.innerHTML = html;
    document.getElementById('add-custom').onclick = openCustomForm;
  }

  function openCustomForm() {
    A.openModal(
      '<h3>新建易混组合<button class="modal-close" data-close>×</button></h3>' +
      '<div class="form-grid">' +
        '<div><label>单词（每行一个，或用空格/逗号分隔，至少 2 个）</label>' +
        '<textarea id="cu-words" placeholder="例如：affect effect"></textarea></div>' +
        '<div><label>辨析要点（可选）</label><textarea id="cu-note" placeholder="这两个词为什么容易混、怎么区分"></textarea></div>' +
        '<div class="hint">词库中已有的词会自动带上音标和释义；新词会在联网时自动查询词典补充。</div>' +
        '<button class="btn block" id="cu-save">保存组合</button>' +
      '</div>'
    );
    document.querySelector('[data-close]').onclick = A.closeModal;
    document.getElementById('cu-save').onclick = saveCustom;
  }
  function saveCustom() {
    var raw = document.getElementById('cu-words').value.trim();
    var note = document.getElementById('cu-note').value.trim();
    var words = raw.split(/[\s,，;；]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (words.length < 2) { A.toast('请至少输入两个单词'); return; }
    var seen = {}, uniq = [];
    words.forEach(function (w) {
      var k = A.normWord(w);
      if (k && !seen[k]) { seen[k] = 1; uniq.push(w); }
    });
    if (uniq.length < 2) { A.toast('去重后不足两个单词'); return; }
    var id = 'u' + String(Date.now()).slice(-8);
    var g = { id: id, level: '自定义', source: '我的组合', words: [], note: note || '（待补充辨析要点）' };
    uniq.forEach(function (w) {
      var hit = A.findWordInBank(w);
      if (hit) g.words.push({ word: hit.w.word, pos: hit.w.pos, ipa: hit.w.ipa, meaning: hit.w.meaning });
      else g.words.push({ word: w, pos: '', ipa: '', meaning: '' });
    });
    A.customs.push(g);
    A.saveCustoms();
    if (A.favs.indexOf(id) === -1) { A.favs.push(id); A.saveFavs(); }
    A.closeModal();
    renderFav();
    A.toast('组合已创建');
    // 联网补全新词
    g.words.forEach(function (w) {
      if (!w.ipa && !w.meaning && A.DICT.online()) {
        A.DICT.lookup(w.word).then(function (d) {
          if (d && !d.error) {
            w.ipa = d.ipa || '';
            w.meaning = d.defs && d.defs.length ? d.defs[0].def : '';
            w.pos = d.defs && d.defs[0] ? d.defs[0].pos : '';
            A.saveCustoms();
            renderFav();
          }
        });
      }
    });
  }

  function openNoteModal(gid) {
    var g = findGroup(gid);
    if (!g) return;
    A.openModal(
      '<h3>备注 · ' + A.esc(g.words.map(function (w) { return w.word; }).join(' / ')) + '<button class="modal-close" data-close>×</button></h3>' +
      '<div class="form-grid">' +
        '<div><label>我的备注（易错点、老师讲的重点、自己的口诀…）</label>' +
        '<textarea id="nt-text" placeholder="为这组词写点笔记">' + A.esc(A.notes[gid] || '') + '</textarea></div>' +
        '<button class="btn block" id="nt-save">保存备注</button>' +
      '</div>'
    );
    document.querySelector('[data-close]').onclick = A.closeModal;
    document.getElementById('nt-save').onclick = function () {
      var v = document.getElementById('nt-text').value.trim();
      if (v) A.notes[gid] = v; else delete A.notes[gid];
      A.saveNotes();
      A.closeModal();
      renderFav(); renderBrowse();
      A.toast(v ? '备注已保存' : '备注已清除');
    };
  }

  // ── 词库维护 ──
  function adminValidate(g, isNew) {
    if (!g || typeof g !== 'object') return '词条格式错误';
    if (!g.id) return '缺少编号';
    if (LEVELS.indexOf(g.level) === -1) return '难度不合法：' + g.level;
    if (!g.words || !Array.isArray(g.words) || g.words.length < 2) return '每组至少需要两个单词';
    if (!g.note || !String(g.note).trim()) return '缺少辨析要点';
    var seen = {};
    for (var i = 0; i < g.words.length; i++) {
      var w = g.words[i];
      if (!w || !w.word || !String(w.word).trim()) return '存在空单词';
      if (!w.meaning || !String(w.meaning).trim()) return '单词 ' + w.word + ' 缺少释义';
      var k = A.normWord(w.word);
      if (!k) return '单词 ' + w.word + ' 不合法';
      if (seen[k]) return '同组内单词重复：' + w.word;
      seen[k] = true;
    }
    if (isNew) {
      for (var j = 0; j < A.bank.length; j++) if (A.bank[j].id === g.id) return '编号已存在：' + g.id;
    }
    return null;
  }
  function nextId() {
    var max = 0;
    A.bank.forEach(function (g) {
      var m = String(g.id).match(/^g(\d+)$/);
      if (m) max = Math.max(max, parseInt(m[1], 10));
    });
    return 'g' + String(max + 1).padStart(3, '0');
  }
  function parseWordsText(text) {
    var lines = String(text).split(/\r?\n/);
    var words = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      var parts = line.split('|').map(function (s) { return s.trim(); });
      if (parts.length < 2) return { error: '第 ' + (i + 1) + ' 行格式错误（应为 单词|释义）' };
      if (!parts[0]) return { error: '第 ' + (i + 1) + ' 行缺少单词' };
      var item = { word: parts[0], pos: '', ipa: '', meaning: '' };
      if (parts.length >= 4) { item.pos = parts[1]; item.ipa = parts[2]; item.meaning = parts[3]; }
      else if (parts.length === 3) { item.pos = parts[1]; item.meaning = parts[2]; }
      else { item.meaning = parts[1]; }
      if (!item.meaning) return { error: '第 ' + (i + 1) + ' 行缺少释义' };
      words.push(item);
    }
    if (words.length < 2) return { error: '至少需要两个单词' };
    return { words: words };
  }
  function wordsToText(g) {
    return g.words.map(function (w) { return w.word + '|' + (w.pos || '') + '|' + (w.ipa || '') + '|' + w.meaning; }).join('\n');
  }
  function renderAdmin() {
    var box = document.getElementById('lib-admin');
    var list = A.bank.filter(function (g) {
      if (!adminSearch) return true;
      var q = A.normWord(adminSearch);
      return g.words.some(function (w) { return A.normWord(w.word).indexOf(q) !== -1; }) || g.id.indexOf(adminSearch) !== -1;
    });
    var html =
      '<div class="card">' +
        '<div class="card-title">词库维护<span class="src-badge">改动保存在本机</span></div>' +
        '<div class="compare-inputs"><input id="ad-search" placeholder="搜索单词或编号" value="' + A.esc(adminSearch) + '"></div>' +
        '<div style="height:10px"></div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="btn small" id="ad-add">＋ 新增词条</button>' +
          '<button class="btn ghost small" id="ad-export">导出 JSON</button>' +
          '<button class="btn ghost small" id="ad-import">导入 JSON</button>' +
          '<button class="btn danger small" id="ad-reset">恢复内置词库</button>' +
        '</div>' +
        '<input type="file" id="ad-file" accept=".json" style="display:none">' +
        (A.bankOverridden ? '<div class="hint" style="margin-top:8px;color:var(--accent)">当前词库已在本机修改过，与线上内置版本不同。</div>' : '') +
      '</div>';
    html += '<div class="result-head"><span>' + list.length + ' 组</span></div>';
    list.forEach(function (g) {
      html += '<div class="card admin-row">' +
        '<div class="group-top"><span class="admin-id">' + A.esc(g.id) + '</span><div class="badges">' + A.badgeHtml(g) + '</div></div>' +
        '<div style="font-weight:700;margin-top:4px">' + g.words.map(function (w) { return A.esc(w.word); }).join(' / ') + '</div>' +
        '<div class="note"><b>辨析：</b>' + A.esc(g.note) + '</div>' +
        '<div class="admin-actions">' +
          '<button class="btn ghost small" data-act="edit" data-id="' + A.esc(g.id) + '">编辑</button>' +
          '<button class="btn danger small" data-act="del" data-id="' + A.esc(g.id) + '">删除</button>' +
        '</div></div>';
    });
    box.innerHTML = html;
    document.getElementById('ad-search').addEventListener('input', function (ev) {
      adminSearch = ev.target.value;
      clearTimeout(box._deb);
      box._deb = setTimeout(renderAdmin, 200);
    });
    document.getElementById('ad-add').onclick = function () { openForm(null); };
    document.getElementById('ad-export').onclick = exportBank;
    document.getElementById('ad-import').onclick = function () { document.getElementById('ad-file').click(); };
    document.getElementById('ad-file').addEventListener('change', importFile);
    document.getElementById('ad-reset').onclick = function () {
      if (confirm('恢复内置词库将清除全部本地修改，是否继续？')) {
        A.resetBank();
        A.refreshBank();
        A.toast('已恢复内置词库');
        renderAdmin();
      }
    };
    box.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-id');
        if (b.getAttribute('data-act') === 'edit') {
          openForm(A.bank.filter(function (g) { return g.id === id; })[0]);
        } else {
          if (confirm('删除词条 ' + id + '？')) {
            A.bank = A.bank.filter(function (g) { return g.id !== id; });
            A.saveBank();
            A.refreshBank();
            renderAdmin();
            A.toast('已删除');
          }
        }
      };
    });
  }
  function openForm(g) {
    editingId = g ? g.id : null;
    A.openModal(
      '<h3>' + (g ? '编辑词条 ' + A.esc(g.id) : '新增词条') + '<button class="modal-close" data-close>×</button></h3>' +
      '<div class="form-grid">' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div><label>难度</label><select id="f-level">' + LEVELS.map(function (l) { return '<option' + (g && g.level === l ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></div>' +
          '<div><label>编号</label><input id="f-id" value="' + (g ? A.esc(g.id) : nextId()) + '"></div>' +
        '</div>' +
        '<div><label>单词（每行：单词|词性|音标|释义，词性和音标可留空）</label>' +
        '<textarea id="f-words" placeholder="affect|v.|/əˈfekt/|影响&#10;effect|n.|/ɪˈfekt/|效果">' + (g ? A.esc(wordsToText(g)) : '') + '</textarea></div>' +
        '<div><label>辨析要点</label><textarea id="f-note">' + (g ? A.esc(g.note) : '') + '</textarea></div>' +
        '<button class="btn block" id="f-save">保存</button>' +
      '</div>'
    );
    document.querySelector('[data-close]').onclick = A.closeModal;
    document.getElementById('f-save').onclick = saveForm;
  }
  function saveForm() {
    var parsed = parseWordsText(document.getElementById('f-words').value);
    if (parsed.error) { A.toast(parsed.error); return; }
    var g = {
      id: document.getElementById('f-id').value.trim() || nextId(),
      level: document.getElementById('f-level').value,
      source: '人教/译林',
      words: parsed.words,
      note: document.getElementById('f-note').value.trim()
    };
    var err = adminValidate(g, !editingId);
    if (err) { A.toast(err); return; }
    if (editingId) {
      for (var i = 0; i < A.bank.length; i++) if (A.bank[i].id === editingId) { A.bank[i] = g; break; }
    } else {
      A.bank.push(g);
    }
    A.saveBank();
    A.refreshBank();
    A.closeModal();
    renderAdmin();
    A.toast('已保存');
  }
  function exportBank() {
    var blob = new Blob([JSON.stringify(A.bank, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '易混词汇词库.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }
  function importFile(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!Array.isArray(data) || !data.length) throw new Error('JSON 不是词条数组');
        var ids = {};
        data.forEach(function (g, i) {
          var err = adminValidate(g, false);
          if (err) throw new Error('第 ' + (i + 1) + ' 条：' + err);
          if (ids[g.id]) throw new Error('编号重复：' + g.id);
          ids[g.id] = 1;
        });
        if (!confirm('导入将替换当前全部 ' + A.bank.length + ' 组词条，是否继续？')) return;
        A.bank = data;
        A.saveBank();
        A.refreshBank();
        renderAdmin();
        A.toast('导入成功：' + data.length + ' 组');
      } catch (e) {
        A.toast('导入失败：' + e.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    ev.target.value = '';
  }

  // ── tab 切换 ──
  function switchLib(tab) {
    libTab = tab;
    document.getElementById('lib-all').hidden = tab !== 'all';
    document.getElementById('lib-fav').hidden = tab !== 'fav';
    document.getElementById('lib-admin').hidden = tab !== 'admin';
    document.querySelectorAll('#lib-tabs .chip').forEach(function (c) {
      c.classList.toggle('active', c.getAttribute('data-lib') === tab);
    });
    if (tab === 'all') { renderLevelChips(); renderTypeChips(); renderBrowse(); }
    if (tab === 'fav') renderFav();
    if (tab === 'admin') renderAdmin();
  }

  function init() {
    document.getElementById('lib-tabs').addEventListener('click', function (ev) {
      var c = ev.target.closest('[data-lib]');
      if (c) switchLib(c.getAttribute('data-lib'));
    });
    document.getElementById('level-filter').addEventListener('click', function (ev) {
      var c = ev.target.closest('[data-level]');
      if (!c) return;
      levelFilter = c.getAttribute('data-level');
      renderLevelChips(); renderBrowse();
    });
    document.getElementById('type-filter').addEventListener('click', function (ev) {
      var c = ev.target.closest('[data-type]');
      if (!c) return;
      typeFilter = c.getAttribute('data-type');
      renderTypeChips(); renderBrowse();
    });
    switchLib('all');
  }
  function render() { switchLib(libTab); }

  A.library = {
    init: init, render: render, onFavChange: function () { if (libTab === 'fav') renderFav(); },
    openNoteModal: openNoteModal
  };
})();

</script>
<script>
/* LEXI train —— 辨析训练 5 模式 + 今日复习 */
(function () {
  'use strict';
  var A = window.App;
  var root;
  var trainLevel = '全部';
  var session = null;
  var rapidTimer = null;

  function allGroups() { return A.bank.concat(A.customs); }
  function byLevel(pool) {
    if (trainLevel === '全部') return pool;
    return pool.filter(function (g) { return g.level === trainLevel; });
  }
  function weightedPick(pool) {
    // 常错权重高
    var items = [];
    pool.forEach(function (g) {
      var s = A.srs.state.get(g.id);
      var w = 1 + (s ? s.lapses * 3 + s.ng : 0);
      items.push({ g: g, w: w });
    });
    var total = items.reduce(function (a, x) { return a + x.w; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < items.length; i++) {
      r -= items[i].w;
      if (r <= 0) return items[i].g;
    }
    return items[items.length - 1].g;
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickGroup(pool) {
    var candidates = byLevel(pool);
    if (!candidates.length) candidates = allGroups();
    return weightedPick(candidates);
  }

  // ── 出题 ──
  function qSpell(g) {
    var w = g.words[Math.floor(Math.random() * g.words.length)];
    return {
      kind: 'spell', gid: g.id, target: w,
      label: '拼写辨析 · 选出符合释义的单词',
      promptHtml: '<div class="qp-sub">哪个单词是</div><div class="qp-main">' + A.esc(w.meaning) + '</div>' +
        '<div class="qp-sub">' + A.esc(w.pos || '') + '</div>',
      options: shuffle(g.words.map(function (x) { return x.word; })),
      answer: w.word
    };
  }
  function qSound(g) {
    var w = g.words[Math.floor(Math.random() * g.words.length)];
    return {
      kind: 'sound', gid: g.id, target: w,
      label: '发音辨析 · 听音选词',
      promptHtml: '<div class="qp-sub">听发音，选出你听到的单词</div>' +
        '<div class="qp-main" style="font-size:15px;color:var(--muted)">🔊 点击下方按钮重听</div>' +
        '<div style="margin-top:10px"><button class="btn ghost" id="q-replay">▶ 重听发音</button></div>' +
        '<div class="qp-sub" style="margin-top:8px">提示：' + A.esc(g.level) + ' · ' + g.words.length + ' 选 1</div>',
      options: shuffle(g.words.map(function (x) { return x.word; })),
      answer: w.word
    };
  }
  function qMeaning(g) {
    var w = g.words[Math.floor(Math.random() * g.words.length)];
    return {
      kind: 'meaning', gid: g.id, target: w,
      label: '词义辨析 · 选出正确释义',
      promptHtml: '<div class="qp-sub">下面这个单词是什么意思？</div>' +
        '<div class="qp-main">' + A.esc(w.word) + '</div>' +
        '<div class="qp-sub">' + A.esc(w.ipa || '') + ' <button class="play-btn" style="position:static;display:inline-flex;margin-left:6px" data-play="' + A.esc(w.word) + '"><svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15"><path d="M8 5v14l11-7z"/></svg></button></div>',
      options: shuffle(g.words.map(function (x) { return x.meaning; })),
      answer: w.meaning
    };
  }
  function qCloze(g) {
    var e = A.examples[g.id];
    if (!e) return null;
    var cands = g.words.filter(function (w) {
      var k = A.normWord(w.word);
      return e.s && e.s[k] && e.s[k].toLowerCase().indexOf(w.word.toLowerCase()) !== -1;
    });
    if (!cands.length) return null;
    var w = cands[Math.floor(Math.random() * cands.length)];
    var s = e.s[A.normWord(w.word)];
    var rx = new RegExp(w.word + '\\w*', 'i');
    if (!rx.test(s)) return null;
    var blanked = A.esc(s).replace(rx, '<span class="qp-blank">____</span>');
    var opts = g.words.map(function (x) { return x.word; });
    // 组内只有 2 词时，从全库抽 1 个近音/近形干扰项
    if (opts.length === 2) {
      var extra = extraDistractor(g, w.word);
      if (extra) opts.push(extra);
    }
    return {
      kind: 'cloze', gid: g.id, target: w, sentence: s,
      label: '句子填空 · 语境选词',
      promptHtml: '<div class="qp-sentence">' + blanked + '</div>' +
        '<div class="qp-sub">根据句意选择正确的单词</div>',
      options: shuffle(opts),
      answer: w.word
    };
  }
  function extraDistractor(g, word) {
    // 从音近对里找一个不在本组的词
    var inGroup = g.words.map(function (x) { return A.normWord(x.word); });
    var shuffled = A.pairs.slice().sort(function () { return Math.random() - 0.5; });
    for (var i = 0; i < shuffled.length; i++) {
      var p = shuffled[i];
      if (p.a === word && inGroup.indexOf(A.normWord(p.b)) === -1) return p.b;
      if (p.b === word && inGroup.indexOf(A.normWord(p.a)) === -1) return p.a;
    }
    return null;
  }

  // ── 会话 ──
  function makeQuestion(mode) {
    var g = pickGroup(allGroups());
    var q = null, tries = 0;
    while (!q && tries < 8) {
      tries++;
      if (mode === 'spell') q = qSpell(g);
      else if (mode === 'sound') q = (A.TTS.ok ? qSound(g) : qSpell(g));
      else if (mode === 'meaning') q = qMeaning(g);
      else if (mode === 'cloze') { q = qCloze(g); if (!q) { g = pickGroup(allGroups()); continue; } }
    }
    return q;
  }
  function makeReviewQuestion(gid, turn) {
    var g = allGroups().filter(function (x) { return x.id === gid; })[0];
    if (!g) return null;
    var kinds = ['spell', 'meaning', 'sound'];
    var k = kinds[turn % kinds.length];
    if (k === 'sound' && !A.TTS.ok) k = 'spell';
    if (k === 'spell') return qSpell(g);
    if (k === 'meaning') return qMeaning(g);
    return qSound(g);
  }

  function startSession(mode, reviewIds) {
    A.TTS.stopLoop();
    clearInterval(rapidTimer);
    session = {
      mode: mode, idx: 0, ok: 0, ng: 0, streak: 0,
      total: mode === 'rapid' ? 0 : (reviewIds ? reviewIds.length : 10),
      results: [], reviewIds: reviewIds || null,
      startTs: Date.now(), rapidCount: 0
    };
    renderSessionHome();
    nextQuestion();
  }

  function currentQ() { return session.q; }

  function nextQuestion() {
    var q;
    if (session.mode === 'review') {
      q = makeReviewQuestion(session.reviewIds[session.idx % session.reviewIds.length], session.idx);
      if (!q) { endSession(); return; }
    } else if (session.mode === 'rapid') {
      q = Math.random() < 0.5 ? makeQuestion('spell') : makeQuestion('meaning');
    } else {
      q = makeQuestion(session.mode);
      if (!q) { A.toast('没有可用的练习素材'); backHome(); return; }
    }
    session.q = q;
    renderQuestion();
    if (q.kind === 'sound') {
      setTimeout(function () { A.TTS.speak(q.answer); }, 350);
      var rp = document.getElementById('q-replay');
      if (rp) rp.onclick = function () { A.TTS.speak(q.answer); };
    }
    if (session.mode === 'rapid') {
      if (!session._rapidStarted) {
        session._rapidStarted = true;
        session.deadline = Date.now() + 60000;
        rapidTimer = setInterval(tickRapid, 250);
      }
    }
  }

  function tickRapid() {
    if (!session || session.mode !== 'rapid') { clearInterval(rapidTimer); return; }
    var left = Math.max(0, session.deadline - Date.now());
    var el = document.getElementById('rapid-timer');
    if (el) el.textContent = '⏱ ' + Math.ceil(left / 1000) + 's';
    if (left <= 0) { clearInterval(rapidTimer); endSession(); }
  }

  function answer(opt) {
    var q = session.q;
    var correct = opt === q.answer;
    A.histPush(q.gid, session.mode, correct);
    A.srs.grade(q.gid, correct, session.streak);
    if (correct) { session.ok++; session.streak++; }
    else { session.ng++; session.streak = 0; }
    session.results.push({ gid: q.gid, word: q.target.word, ok: correct });
    session.rapidCount++;
    if (session.mode === 'review' && correct) {
      // 复习完成的一组出队：把该组 due 推到未来
    }
    renderFeedback(correct, opt);
  }

  function feedbackHtml(correct, opt) {
    var q = session.q;
    var g = allGroups().filter(function (x) { return x.id === q.gid; })[0];
    var title = correct ? '✓ 回答正确' : '✗ 回答错误';
    var body = '';
    if (q.kind === 'spell') {
      body += '正确答案：<b>' + A.esc(q.answer) + '</b>（' + A.esc(q.target.meaning) + '）<br>';
      if (!correct) {
        var md = A.markDiff(opt, q.answer);
        body += '你的选择与正确答案拼写相差 ' + md.positions + ' 处：<br>' +
          '<span class="diff-mark">' + md.a + '</span> vs <span class="diff-mark">' + md.b + '</span><br>';
      }
    } else if (q.kind === 'sound') {
      body += '你听到的是：<b>' + A.esc(q.answer) + '</b>' + (q.target.ipa ? ' ' + A.esc(q.target.ipa) : '') + '<br>';
      if (!correct && q.target.ipa) {
        var other = g.words.filter(function (x) { return x.word === opt; })[0];
        if (other && other.ipa) {
          var d = A.ipaDiffView(other.ipa, q.target.ipa);
          body += '音标对照：' + d.a + ' vs ' + d.b + '<br>';
        }
      }
    } else if (q.kind === 'meaning') {
      body += '<b>' + A.esc(q.target.word) + '</b> = ' + A.esc(q.target.meaning) + '<br>';
    } else if (q.kind === 'cloze') {
      body += '完整句子：' + A.esc(q.sentence) + '<br>';
      if (!correct) body += '正确答案是 <b>' + A.esc(q.answer) + '</b>。<br>';
    }
    if (g && g.note) body += '<span style="color:var(--primary-deep)"><b>辨析要点：</b>' + A.esc(g.note) + '</span>';
    return '<div class="feedback ' + (correct ? 'good' : 'bad') + '">' +
      '<div class="fb-title">' + title + '</div><div class="fb-body">' + body + '</div></div>' +
      '<div style="height:10px"></div><button class="btn block" id="q-next">' +
      (session.mode === 'rapid' ? '下一题' : (session.idx + 1 >= session.total && session.mode !== 'review' ? '查看结果' : '下一题')) + '</button>';
  }

  function renderQuestion() {
    var q = session.q;
    var progress = session.mode === 'rapid' ? '' :
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round(session.idx * 100 / session.total) + '%"></div></div><span>' + (session.idx + 1) + '/' + session.total + '</span>';
    var optsHtml = q.options.map(function (o, i) {
      return '<button class="opt-btn" data-opt="' + A.esc(o) + '"><span class="opt-key">' + 'ABCDEFGH'[i] + '</span>' + A.esc(o) + '</button>';
    }).join('');
    root.innerHTML =
      '<div class="quiz-top">' + progress +
      (session.mode === 'rapid' ? '<span class="timer" id="rapid-timer">⏱ 60s</span>' : '') +
      '<button class="btn ghost small" id="q-quit">退出</button></div>' +
      '<div class="quiz-prompt"><div class="qp-label">' + q.label + '</div>' + q.promptHtml + '</div>' +
      '<div class="opt-list" id="opt-list">' + optsHtml + '</div>' +
      '<div id="fb-area"></div>';
    document.getElementById('q-quit').onclick = backHome;
    document.getElementById('opt-list').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-opt]');
      if (!b) return;
      answer(b.getAttribute('data-opt'));
    });
  }

  function renderFeedback(correct, opt) {
    var q = session.q;
    var area = document.getElementById('fb-area');
    document.querySelectorAll('#opt-list .opt-btn').forEach(function (b) {
      var v = b.getAttribute('data-opt');
      if (v === q.answer) b.classList.add('correct');
      else if (v === opt) b.classList.add('wrong');
      b.disabled = true;
      b.style.pointerEvents = 'none';
    });
    area.innerHTML = feedbackHtml(correct, opt);
    document.getElementById('q-next').onclick = function () {
      session.idx++;
      if (session.mode === 'review') {
        if (session.idx >= session.total) { endSession(); return; }
        nextQuestion();
      } else if (session.mode === 'rapid') {
        nextQuestion();
      } else {
        if (session.idx >= session.total) { endSession(); return; }
        nextQuestion();
      }
    };
    if (q.kind !== 'sound') {
      // 正确时轻读一遍答案词，强化语音印象
      if (correct && session.mode !== 'sound') A.TTS.speak(q.answer);
    }
  }

  function endSession() {
    clearInterval(rapidTimer);
    var total = session.mode === 'rapid' ? session.rapidCount : session.results.length;
    var okN = session.results.filter(function (r) { return r.ok; }).length;
    var wrongs = session.results.filter(function (r) { return !r.ok; });
    var secs = Math.round((Date.now() - session.startTs) / 1000);
    var modeName = { spell: '拼写辨析', sound: '发音辨析', meaning: '词义辨析', cloze: '句子填空', rapid: '快速对比', review: '今日复习' }[session.mode];
    var html = '<div class="card result-card">' +
      '<div style="font-size:13px;color:var(--muted)">' + modeName + ' · 用时 ' + secs + ' 秒</div>' +
      '<div class="result-score">' + okN + '<span style="font-size:20px;color:var(--muted)"> / ' + total + '</span></div>' +
      '<div class="result-sub">' + (total && okN / total >= 0.8 ? '太棒了，这批词已经很稳了！' : '错过的词已自动加入复习计划，明天见！') + '</div>';
    if (wrongs.length) {
      html += '<div style="text-align:left"><div class="card-title">本次错词</div>';
      wrongs.forEach(function (r) {
        var g = allGroups().filter(function (x) { return x.id === r.gid; })[0];
        html += '<div class="err-row"><span>' + A.esc(r.word) + (g ? '<span class="src-badge">' + A.esc(g.words.map(function (w) { return w.word; }).join(' / ')) + '</span>' : '') + '</span><span style="color:var(--danger)">再记一遍</span></div>';
      });
      html += '</div>';
    }
    html += '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn block" id="r-again">再来一组</button>' +
      '<button class="btn ghost block" id="r-home">返回</button></div></div>';
    root.innerHTML = html;
    document.getElementById('r-again').onclick = function () { startSession(session.mode, session.reviewIds ? dueIds() : null); };
    document.getElementById('r-home').onclick = backHome;
    A.renderAppbar();
  }

  function dueIds() { return A.srs.dueList().map(function (x) { return x.id; }); }

  function backHome() {
    clearInterval(rapidTimer);
    A.TTS.stopLoop();
    session = null;
    renderSessionHome();
  }

  // ── 训练主页 ──
  function renderSessionHome() {
    var due = A.srs.dueCount();
    var html = '';
    if (due > 0) {
      html += '<div class="review-banner"><div><div class="rt">今日待复习 ' + due + ' 组</div>' +
        '<div class="rs">根据你的错误记录安排，常错的词优先出现</div></div>' +
        '<button class="btn small" id="go-review">开始复习</button></div>';
    } else {
      html += '<div class="review-banner" style="opacity:.75"><div><div class="rt">今日暂无复习任务</div>' +
        '<div class="rs">完成训练后，易错的词会自动进入复习计划</div></div></div>';
    }
    var chips = ['全部'].concat(A.LEVELS);
    html += '<div class="chips">' + chips.map(function (lv) {
      return '<button class="chip' + (lv === trainLevel ? ' active' : '') + '" data-tlevel="' + lv + '">' + lv + '</button>';
    }).join('') + '</div>';
    html += '<div class="mode-grid">' +
      '<button class="mode-card" data-mode="spell"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4" width="8" height="16" rx="1.5"/><rect x="13.5" y="4" width="8" height="16" rx="1.5"/><text x="6.5" y="16.5" text-anchor="middle" font-size="9" font-family="serif" fill="currentColor" stroke="none">A</text><text x="17.5" y="16.5" text-anchor="middle" font-size="9" font-family="serif" fill="currentColor" stroke="none">B</text></svg></div><div class="mt">拼写辨析</div><div class="md">看释义，选对单词</div></button>' +
      '<button class="mode-card" data-mode="sound"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10v4h4l5 4V6l-5 4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M18.8 6.2a8 8 0 0 1 0 11.6"/></svg></div><div class="mt">发音辨析</div><div class="md">听音频，判断单词</div></button>' +
      '<button class="mode-card" data-mode="meaning"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M9 8h7M9 12h7"/></svg></div><div class="mt">词义辨析</div><div class="md">看单词，选对释义</div></button>' +
      '<button class="mode-card" data-mode="cloze"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20h16M14.5 3.5l3 3L8 16l-4 1 1-4z"/><path d="M5 12.5h5"/></svg></div><div class="mt">句子填空</div><div class="md">语境中区分易混词</div></button>' +
      '<button class="mode-card" style="grid-column:1/-1" data-mode="rapid"><div class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div><div class="mt">快速对比 · 60 秒限时挑战</div><div class="md">在限定时间内完成尽量多的辨析</div></button>' +
      '</div>';
    html += '<div class="result-head" style="margin-top:14px"><span>共 ' + allGroups().length + ' 组词条参与出题 · 答错的词自动进入复习计划</span></div>';
    root.innerHTML = html;
    document.querySelectorAll('[data-tlevel]').forEach(function (c) {
      c.onclick = function () { trainLevel = c.getAttribute('data-tlevel'); renderSessionHome(); };
    });
    document.querySelectorAll('[data-mode]').forEach(function (c) {
      c.onclick = function () {
        var m = c.getAttribute('data-mode');
        if (m === 'sound' && !A.TTS.ok) { A.toast('当前浏览器不支持语音，暂不可用发音辨析'); return; }
        startSession(m, null);
      };
    });
    var gr = document.getElementById('go-review');
    if (gr) gr.onclick = function () {
      var ids = dueIds();
      if (!ids.length) { A.toast('复习任务已完成！'); renderSessionHome(); return; }
      startSession('review', ids);
    };
  }

  function init() { root = document.getElementById('train-root'); renderSessionHome(); }
  function render() { if (!session) renderSessionHome(); }

  A.train = { init: init, render: render, renderHome: renderSessionHome };
})();

</script>
<script>
/* LEXI mine —— 学习统计 / 设置 / 数据管理 */
(function () {
  'use strict';
  var A = window.App;

  function render() {
    var srs = A.srs;
    var acc = srs.accuracy();
    var mastery = srs.masteryCounts();
    var total = mastery.none + mastery.learning + mastery.mastered;
    var streak = srs.streakDays();
    var learned = srs.state.count();
    var todayN = A.hist.filter(function (h) { return A.todayStrOf(h.t) === A.todayStr(); }).length;

    var mColors = { learning: '#f59e0b', mastered: '#15803d' };
    var mwL = total ? Math.round(mastery.learning * 100 / total) : 0;
    var mwM = total ? Math.round(mastery.mastered * 100 / total) : 0;

    var weakest = srs.weakest(8);
    var allGroups = function () { return A.bank.concat(A.customs); };

    var html = '';
    // 统计
    html += '<div class="page-head"><h2>学习统计</h2></div>';
    html += '<div class="card"><div class="stat-grid">' +
      '<div class="stat-cell"><div class="sv">' + learned + '</div><div class="sl">已学词条</div></div>' +
      '<div class="stat-cell"><div class="sv">' + (acc.rate == null ? '—' : acc.rate + '%') + '</div><div class="sl">总正确率</div></div>' +
      '<div class="stat-cell"><div class="sv">' + streak + '</div><div class="sl">连续学习天数</div></div>' +
      '<div class="stat-cell"><div class="sv">' + todayN + '</div><div class="sl">今日答题</div></div>' +
      '</div>' +
      '<div style="margin-top:12px"><div class="card-title" style="font-size:13px">掌握度分布</div>' +
      '<div class="mastery-bar"><span style="width:' + (100 - mwL - mwM) + '%;background:var(--border)"></span>' +
      '<span style="width:' + mwL + '%;background:' + mColors.learning + '"></span>' +
      '<span style="width:' + mwM + '%;background:' + mColors.mastered + '"></span></div>' +
      '<div class="legend"><span><i style="background:var(--border)"></i>未开始 ' + mastery.none + '</span>' +
      '<span><i style="background:' + mColors.learning + '"></i>学习中 ' + mastery.learning + '</span>' +
      '<span><i style="background:' + mColors.mastered + '"></i>已掌握 ' + mastery.mastered + '</span></div></div></div>';

    // 易错词条
    html += '<div class="card"><div class="card-title">最易错词条<span class="src-badge">按错误次数排序</span></div>';
    if (!weakest.length) html += '<div class="empty" style="padding:14px">还没有错误记录，去"训练"练一组吧！</div>';
    else {
      weakest.forEach(function (gid) {
        var s = srs.state.get(gid);
        var g = allGroups().filter(function (x) { return x.id === gid; })[0];
        if (!g || !s) return;
        var rate = s.ok + s.ng ? Math.round(s.ok * 100 / (s.ok + s.ng)) : 0;
        html += '<div class="err-row"><span><b>' + g.words.map(function (w) { return A.esc(w.word); }).join(' / ') + '</b>' +
          '<span class="src-badge">' + A.esc(g.level) + '</span></span>' +
          '<span>错 ' + s.ng + ' 次 · 正确率 ' + rate + '%' +
          '<button class="btn ghost small" style="margin-left:8px" data-err-review="' + A.esc(gid) + '">复习</button></span></div>';
      });
    }
    html += '</div>';

    // 设置
    html += '<div class="page-head"><h2>设置</h2></div>';
    html += '<div class="card">' +
      '<div class="set-row"><span class="sl-label">发音口音</span><div class="seg" id="set-accent">' +
        '<button data-a="US"' + (A.settings.accent !== 'UK' ? ' class="active"' : '') + '>美音</button>' +
        '<button data-a="UK"' + (A.settings.accent === 'UK' ? ' class="active"' : '') + '>英音</button></div></div>' +
      '<div class="set-row"><span class="sl-label">语速</span><input type="range" class="range" id="set-rate" min="0.6" max="1.2" step="0.05" value="' + A.settings.rate + '"></div>' +
      '<div class="set-row"><span class="sl-label">训练时自动发音</span><div class="toggle' + (A.settings.autoSpeak ? ' on' : '') + '" id="set-auto"></div></div>' +
      '</div>';

    // 数据
    html += '<div class="card">' +
      '<div class="card-title">学习数据<span class="src-badge">全部保存在本机浏览器</span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn ghost small" id="dt-export">导出备份</button>' +
        '<button class="btn ghost small" id="dt-import">导入备份</button>' +
        '<button class="btn danger small" id="dt-clear">清除学习记录</button>' +
      '</div>' +
      '<input type="file" id="dt-file" accept=".json" style="display:none">' +
      '<div class="hint" style="margin-top:8px">备份包含：收藏、备注、自定义组合、复习计划、答题历史与设置。换手机时导出再导入即可迁移。</div></div>';

    // 关于
    html += '<div class="page-head"><h2>关于</h2></div>';
    html += '<div class="card" style="font-size:13px;color:var(--muted)">' +
      '<p style="margin:0 0 8px"><b style="color:var(--ink)">LEXI · 易混词辨析 v2.0</b></p>' +
      '<p style="margin:0 0 8px">词库整理自人教版、译林版课标层级词汇及四六级词表（' + A.bank.length + ' 组 / 内置音标全覆盖）；四级以上词条配精选参考例句。例句为教学参考内容，词典释义以权威词典为准。</p>' +
      '<p style="margin:0 0 8px">发音：系统语音合成（Web Speech API）+ 在线词典真人发音（需联网，自动缓存）。复习算法：SM-2 间隔重复（借鉴 Anki / FSRS 思路）。</p>' +
      '<p style="margin:0">所有学习数据仅保存在本机，不联网上传。</p></div>';

    document.getElementById('mine-root').innerHTML = html;
    bind();
  }

  function bind() {
    document.querySelectorAll('#set-accent button').forEach(function (b) {
      b.onclick = function () {
        A.settings.accent = b.getAttribute('data-a');
        A.saveSettings();
        document.querySelectorAll('#set-accent button').forEach(function (x) { x.classList.toggle('active', x === b); });
        A.TTS.speak('access');
      };
    });
    var rate = document.getElementById('set-rate');
    rate.oninput = function () { A.settings.rate = parseFloat(rate.value); };
    rate.onchange = function () { A.saveSettings(); A.TTS.speak('practice makes perfect'); };
    document.getElementById('set-auto').onclick = function () {
      A.settings.autoSpeak = !A.settings.autoSpeak;
      A.saveSettings();
      this.classList.toggle('on', A.settings.autoSpeak);
    };
    document.querySelectorAll('[data-err-review]').forEach(function (b) {
      b.onclick = function () {
        A.srs.setDueToday(b.getAttribute('data-err-review'));
        A.toast('已加入今日复习，去"训练"页开始');
        A.switchNav('train');
      };
    });
    document.getElementById('dt-export').onclick = exportData;
    document.getElementById('dt-import').onclick = function () { document.getElementById('dt-file').click(); };
    document.getElementById('dt-file').addEventListener('change', importData);
    document.getElementById('dt-clear').onclick = function () {
      if (!confirm('确定清除全部学习记录（收藏/备注/复习计划/历史）？此操作不可恢复，建议先导出备份。')) return;
      ['yh_fav_v1', 'yh_notes_v1', 'yh_custom_v1', 'yh_srs_v1', 'yh_hist_v1'].forEach(function (k) { A.LS.del(k); });
      A.favs = []; A.notes = {}; A.customs = []; A.hist = [];
      A.srs.clearAll();
      render();
      A.renderAppbar();
      A.toast('已清除');
    };
  }

  function exportData() {
    var payload = {
      app: 'LEXI', ver: 2, exportedAt: new Date().toISOString(),
      favs: A.favs, notes: A.notes, customs: A.customs, hist: A.hist,
      srs: A.srs.exportAll(), settings: A.settings, bank: A.bankOverridden ? A.bank : null
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lexi-backup-' + A.todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }
  function importData(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (d.app !== 'LEXI') throw new Error('不是 LEXI 备份文件');
        A.favs = d.favs || [];
        A.notes = d.notes || {};
        A.customs = d.customs || [];
        A.hist = d.hist || [];
        A.settings = d.settings || A.settings;
        A.LS.set('yh_srs_v1', d.srs || {});
        if (d.bank) A.LS.set('yhbank_v1', d.bank);
        A.saveFavs(); A.saveNotes(); A.saveCustoms(); A.saveHist(); A.saveSettings();
        A.refreshBank();
        render();
        A.renderAppbar();
        A.toast('备份已导入');
      } catch (e) {
        A.toast('导入失败：' + e.message);
      }
    };
    reader.readAsText(file, 'utf-8');
    ev.target.value = '';
  }

  function init() { render(); }

  A.mine = { init: init, render: render };
})();

</script>
</body>
